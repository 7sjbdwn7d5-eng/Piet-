<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pompeji – Marcus und Felix</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton-latin-400-normal.woff2') format('woff2'); }
  html,body{margin:0;background:#000} canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  Story-Format (Vorlage): "Pompeji – Marcus und Felix"
//  Flache Vektor-Illustration, Figuren mit Mimik, Kamera-Moves,
//  unscharfe Hintergründe, 2–3-Wort-Untertitel, REAL-Fakten-Schild.
// ============================================================
const W = 1080, H = 1920;
let ctx = document.getElementById('c').getContext('2d');
const MAIN = ctx;
const OFF = {};
const CAP = '"Anton", "Inter", sans-serif', UI = '"Inter", sans-serif';

// ---- Zeitplan (Video-Sekunden) – auf den Sprecher gelegt ----
const T = {
  dawn: 0, bakery: 3.9, dog: 5.9, growl: 7.85, quake: 9.45, shrug: 10.85, bang: 12.8, plume: 14.45, scale: 16.7,
  pumice: 18.55, roof: 20.1, run: 21.45, chain: 23.05, flow: 25.0, flee: 27.85, end: 29.6, cta: 30.8, out: 33.6,
};
window.DURATION = T.out;
const SHOTS = ['dawn', 'bakery', 'dog', 'growl', 'quake', 'shrug', 'bang', 'plume', 'scale', 'pumice', 'roof', 'run', 'chain', 'flow', 'flee', 'end'];
// REAL-Schilder: [von, bis, Text]
const REAL = [
  [T.bakery + 0.4, T.dog, '81 verkohlte Brote in einer Bäckerei gefunden'],
  [T.quake + 0.3, T.bang, 'Tagelang Erdbeben vor dem Ausbruch'],
  [T.scale + 0.2, T.pumice, 'Aschesäule rund 30 km hoch'],
  [T.pumice + 0.3, T.run, 'Menschen banden sich Kissen auf den Kopf'],
  [T.flow + 0.3, T.end, 'Glutwolken: über 100 km/h, mehrere 100 °C'],
  [T.end + 0.6, T.out, 'Über 1.100 Opfer wurden in Pompeji gefunden'],
];
// Untertitel: wird von captions.json ersetzt, falls vorhanden (window.CAPTIONS)
let CAPTIONS = window.CAPTIONS || [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, k) { const A = hex(a), B2 = hex(b); return `rgb(${lerp(A[0], B2[0], k) | 0},${lerp(A[1], B2[1], k) | 0},${lerp(A[2], B2[2], k) | 0})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(79); const rr = (a, b) => lerp(a, b, R());
function shotOf(t) { let s = SHOTS[0]; for (const k of SHOTS) if (t >= T[k]) s = k; return s; }
function nextT(k) { const i = SHOTS.indexOf(k); return i < SHOTS.length - 1 ? T[SHOTS[i + 1]] : T.out; }
// Schnelle Unschärfe: Ebene in kleiner Auflösung zeichnen und hochskaliert einblenden (statt teurem ctx.filter)
function layer(factor, fn, filter = 'none') {
  const key = factor; if (!OFF[key]) { const c = document.createElement('canvas'); c.width = Math.ceil(W / factor); c.height = Math.ceil(H / factor); OFF[key] = c; }
  const oc = OFF[key], o = oc.getContext('2d'), main = ctx, m = main.getTransform();
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height);
  o.setTransform(m.a / factor, m.b / factor, m.c / factor, m.d / factor, m.e / factor, m.f / factor);
  ctx = o; try { fn(); } finally { ctx = main; }
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.imageSmoothingEnabled = true; main.imageSmoothingQuality = 'high'; main.filter = filter; main.drawImage(oc, 0, 0, W, H); main.restore();
}
function blurred(px, fn) { layer(px >= 10 ? 7 : 5, fn); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

// ============================================================
//  FIGUREN (flacher Stil, große Augen, Mimik)
// ============================================================
// mood: 'calm' | 'happy' | 'worried' | 'shock' | 'sad'
function face(x, y, r, mood, look = [0, 0], o = {}) {
  const eyeR = r * 0.2, ex = r * 0.36, ey = -r * 0.05;
  for (const s of [-1, 1]) {
    const open = mood === 'shock' ? 1.25 : 1;
    ell(x + s * ex, y + ey, eyeR * open, eyeR * 1.15 * open, '#ffffff');
    circ(x + s * ex + look[0] * eyeR * 0.45, y + ey + look[1] * eyeR * 0.45, eyeR * (mood === 'shock' ? 0.45 : 0.6), '#231a17');
    circ(x + s * ex + look[0] * eyeR * 0.45 - eyeR * 0.18, y + ey + look[1] * eyeR * 0.45 - eyeR * 0.2, eyeR * 0.16, '#fff');
    // Augenbrauen: innen höher = besorgt/traurig, innen tiefer = wütend
    ctx.strokeStyle = o.brow || '#3a2418'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round'; ctx.beginPath();
    const by = y + ey - eyeR * 1.55 - (mood === 'shock' ? eyeR * 0.5 : 0) - (mood === 'happy' ? eyeR * 0.15 : 0);
    const innerUp = mood === 'worried' || mood === 'sad' ? eyeR * 0.55 : mood === 'angry' ? -eyeR * 0.5 : 0;
    ctx.moveTo(x + s * (ex - eyeR * 0.9), by - innerUp); ctx.lineTo(x + s * (ex + eyeR), by + innerUp * 0.3);
    ctx.stroke();
  }
  // Mund
  ctx.strokeStyle = '#3a1f17'; ctx.lineWidth = r * 0.07; ctx.beginPath();
  const my = y + r * 0.45;
  if (mood === 'happy') ctx.arc(x, my - r * 0.12, r * 0.22, 0.2, Math.PI - 0.2);
  else if (mood === 'shock') { ctx.stroke(); ell(x, my, r * 0.12, r * 0.16, '#3a1f17'); return; }
  else if (mood === 'worried' || mood === 'sad') ctx.arc(x, my + r * 0.14, r * 0.18, Math.PI + 0.4, -0.4);
  else { ctx.moveTo(x - r * 0.14, my); ctx.lineTo(x + r * 0.14, my); }
  ctx.stroke();
}
function sweat(x, y, s, t) { const k = (t * 1.2) % 1; ctx.save(); ctx.globalAlpha = 1 - k * 0.6; ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(x, y + k * 20 * s - 18 * s); ctx.quadraticCurveTo(x + 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s + 10 * s); ctx.quadraticCurveTo(x - 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s - 18 * s); ctx.fill(); ctx.restore(); }
// Person (Ganzkörper). opts: skin, tunic, hair, mood, look, arms:[l,r] Winkel, walk, carry
function person(x, y, s, o = {}) {
  const skin = o.skin || '#e0a57a', tunic = o.tunic || '#c9583a', hair = o.hair || '#3a2418';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const w = o.walk || 0, lg = Math.sin(w) * 18;
  // Beine
  ctx.strokeStyle = skin; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -110); ctx.lineTo(-20 - lg, -8); ctx.moveTo(16, -110); ctx.lineTo(20 + lg, -8); ctx.stroke();
  ell(-22 - lg, -4, 22, 10, '#6a4126'); ell(22 + lg, -4, 22, 10, '#6a4126');   // Sandalen
  // Tunika
  poly([[-46, -270], [46, -270], [62, -105], [-62, -105]], tunic);
  rect(-50, -200, 100, 12, 'rgba(0,0,0,0.15)');
  // Arme
  const [al, ar] = o.arms || [0.15, -0.15];
  ctx.strokeStyle = skin; ctx.lineWidth = 20;
  for (const [sx, v] of [[-1, al], [1, ar]]) { const a = Math.abs(v); ctx.beginPath(); ctx.moveTo(sx * 40, -255); ctx.lineTo(sx * 40 + sx * Math.sin(a) * 105, -255 + Math.cos(a) * 105); ctx.stroke(); }
  // Kopf
  circ(0, -330, 62, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -342, 64, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(40, -360, 0, -362); ctx.fill();
  if (o.beard) { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -318, 58, 0.15, Math.PI - 0.15); ctx.fill(); circ(0, -318, 40, skin); }
  face(0, -326, 62, o.mood || 'calm', o.look || [0, 0], { brow: hair });
  if (o.sweat) sweat(56, -380, 1.2, o.t || 0);
  if (o.pillow) { rrect(-80, -440, 160, 56, 26, '#e9d8b8'); rect(-80, -414, 160, 6, '#c9b590'); }
  ctx.restore();
}
// Hund Felix (Beagle-Art). side view; mood; head close-ups via dogHead
function dogHead(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const ear = Math.sin((o.t || 0) * 3) * 0.05 + (o.earsBack ? -0.35 : 0);
  ctx.save(); ctx.rotate(ear); ell(-120, 40, 60, 140, '#7a4220', 0.2); ctx.restore();
  ctx.save(); ctx.rotate(-ear); ell(120, 40, 60, 140, '#7a4220', -0.2); ctx.restore();
  ell(0, 0, 150, 140, '#c27a3e');
  poly([[-10, -136], [10, -136], [38, 20], [-38, 20]], '#f6efe4');
  ell(0, 80, 110, 80, '#f6efe4');
  ell(0, 40, 34, 24, '#1d1412');
  const grr = o.growl ? 1 : 0;
  if (grr) { rrect(-60, 100, 120, 40, 16, '#5a1e1e'); ctx.fillStyle = '#fff'; for (let i = -2; i <= 2; i++) poly([[i * 22 - 9, 100], [i * 22 + 9, 100], [i * 22, 118]], '#fff'); }
  else { ctx.strokeStyle = '#3a1f17'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(0, 86); ctx.arc(-22, 86, 22, 0, Math.PI * 0.8); ctx.moveTo(0, 86); ctx.arc(22, 86, 22, Math.PI, Math.PI * 0.2, true); ctx.stroke(); }
  for (const sx of [-1, 1]) {
    ell(sx * 62, -30, 30, 34, '#ffffff'); circ(sx * 62 + (o.look ? o.look[0] * 8 : 0), -26 + (o.look ? o.look[1] * 8 : 0), 19, '#231a17'); circ(sx * 56, -34, 6, '#fff');
    ctx.strokeStyle = '#5a3016'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath();
    if (o.mood === 'sad') { ctx.moveTo(sx * 30, -82); ctx.lineTo(sx * 92, -66); } else if (o.growl) { ctx.moveTo(sx * 30, -66); ctx.lineTo(sx * 92, -84); } else { ctx.moveTo(sx * 34, -76); ctx.lineTo(sx * 90, -76); }
    ctx.stroke();
  }
  if (o.collar) { rrect(-110, 150, 220, 34, 14, '#b3261e'); circ(0, 190, 14, '#e2b33c'); }
  ctx.restore();
}
function dogBody(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.face || 1), s);
  const w = o.walk || 0;
  ctx.strokeStyle = '#c27a3e'; ctx.lineWidth = 22; ctx.lineCap = 'round';
  for (const [lx, ph] of [[-70, 0], [-45, Math.PI], [55, Math.PI / 2], [80, Math.PI * 1.5]]) { ctx.beginPath(); ctx.moveTo(lx, -40); ctx.lineTo(lx + Math.sin(w + ph) * 14, 30); ctx.stroke(); }
  ell(0, -60, 110, 55, '#c27a3e'); ell(-10, -40, 70, 30, '#f6efe4');
  ctx.strokeStyle = '#c27a3e'; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(-100, -80); ctx.quadraticCurveTo(-150, -130 + Math.sin((o.t || 0) * 12) * 10, -130, -160); ctx.stroke();
  ctx.restore();
  dogHead(x + 120 * s * (o.face || 1), y - 120 * s, 0.55 * s, o);
}

// ============================================================
//  KULISSEN
// ============================================================
function sky(top, bot, y1 = 1300) { const g = ctx.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, y1 + 400); }
function vesuvius(cx, base, s, o = {}) {
  ctx.save(); ctx.translate(cx, base); ctx.scale(s, s);
  poly([[-700, 0], [-260, -430], [-120, -500], [60, -470], [260, -380], [720, 0]], o.col || '#6f5a6e');
  poly([[-120, -500], [60, -470], [120, -300], [-200, -260]], o.shade || 'rgba(0,0,0,0.12)');
  if (o.smoke) for (let i = 0; i < 6; i++) { const k = ((o.t || 0) * 0.2 + i / 6) % 1; ctx.fillStyle = `rgba(230,230,230,${0.45 * (1 - k)})`; ctx.beginPath(); ctx.arc(-30 + k * 80, -510 - k * 160, 24 + k * 40, 0, 7); ctx.fill(); }
  ctx.restore();
}
function town(base, o = {}) {
  const dark = o.dark || 0;
  const wall = mixc('#e8c9a0', '#5a4a4a', dark), wall2 = mixc('#d9a878', '#4a3c40', dark), roof = mixc('#c2593a', '#4a2a26', dark);
  const hs = [[-40, 260, 300], [200, 230, 380], [420, 280, 260], [690, 240, 340], [920, 260, 300]];
  for (const [x, w, h] of hs) {
    rect(x, base - h, w, h, x % 2 ? wall : wall2);
    poly([[x - 16, base - h], [x + w / 2, base - h - 70], [x + w + 16, base - h]], roof);
    rect(x + w / 2 - 34, base - 120, 68, 120, mixc('#5a3a26', '#221616', dark));
    rect(x + 30, base - h + 50, 46, 40, mixc('#3a2a20', '#1a1010', dark));
  }
  // Säulen
  for (let i = 0; i < 4; i++) { rect(120 + i * 90, base - 220, 26, 220, mixc('#f1e2c6', '#6a5a5a', dark)); }
  rect(100, base - 236, 330, 22, mixc('#f1e2c6', '#6a5a5a', dark));
}
function street(base, o = {}) { const g = ctx.createLinearGradient(0, base, 0, H); g.addColorStop(0, mixc('#c9a47a', '#3a3036', o.dark || 0)); g.addColorStop(1, mixc('#a8825a', '#221c20', o.dark || 0)); ctx.fillStyle = g; ctx.fillRect(-400, base, W + 800, H - base + 400);
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; for (let y = base + 30; y < H + 200; y += 70) for (let x = ((y / 70) % 2) * 60 - 100; x < W + 100; x += 120) ctx.fillRect(x, y, 100, 50); }
function bakeryBg(t, o = {}) {
  rect(-200, -200, W + 400, H + 400, '#8a5a3a');
  for (let y = 0; y < 1500; y += 80) for (let x = (y / 80) % 2 ? -60 : 0; x < W + 100; x += 120) rect(x + 3, y + 3, 114, 74, 'rgba(255,255,255,0.05)');
  // Ofen (Kuppel)
  ell(300, 1180, 320, 300, '#a8704a'); ell(300, 1230, 150, 120, '#2a1208');
  const glow = ctx.createRadialGradient(300, 1240, 10, 300, 1240, 260); glow.addColorStop(0, 'rgba(255,170,60,0.95)'); glow.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = glow; ctx.fillRect(40, 980, 520, 520);
  // Regal mit Broten
  rect(620, 820, 420, 20, '#5a3a20'); rect(620, 1020, 420, 20, '#5a3a20');
  for (let i = 0; i < 4; i++) { loaf(680 + i * 100, 790, 0.5); loaf(680 + i * 100, 990, 0.5); }
  rect(-200, 1450, W + 400, 600, '#6a4228');
}
function loaf(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ell(0, 0, 90, 60, '#b8692e'); ctx.strokeStyle = '#7a3e16'; ctx.lineWidth = 8; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(i * Math.PI / 4) * 80, Math.sin(i * Math.PI / 4) * 50); ctx.moveTo(0, 0); ctx.lineTo(-Math.cos(i * Math.PI / 4) * 80, -Math.sin(i * Math.PI / 4) * 50); ctx.stroke(); } ctx.restore(); }
const puffs = Array.from({ length: 70 }, () => ({ a: R(), b: R(), c: R(), d: R() }));
function plume(cx, base, h, t, o = {}) {
  // pinienförmige Aschesäule (so beschrieb sie Plinius der Jüngere)
  const col = o.col || '#5a5358', dark = mixc(col, '#2a2428', 0.35), light = mixc(col, '#9a9096', 0.45);
  layer(2, () => {
  // Säule: weiche Wölkchen entlang einer leicht schwankenden Achse
  for (let i = 0; i < 40; i++) { const p = puffs[i], k = i / 39, y = base - k * h * 0.8; const w = 50 + k * 70;
    const x = cx + Math.sin(k * 5 + t * 1.5) * 14 + (p.a - 0.5) * w * 0.9;
    circ(x, y, w * (0.55 + p.b * 0.6), p.c > 0.55 ? col : (p.c > 0.25 ? dark : light)); }
  // Schirm oben
  for (let i = 40; i < 70; i++) { const p = puffs[i]; const ang = p.a * Math.PI * 2 + t * 0.15, rx = h * (0.22 + 0.25 * p.b), ry = h * (0.06 + 0.07 * p.d);
    circ(cx + Math.cos(ang) * rx, base - h * 0.86 + Math.sin(ang) * ry - p.c * h * 0.05, h * (0.08 + 0.07 * p.c) + 20, p.d > 0.5 ? col : (p.d > 0.2 ? light : dark)); }
  });
}
function pyroFlow(points, t, o = {}) {
  // Glutwolke: wogende, glühende Front entlang eines Pfades
  layer(2, () => {
  for (let i = 0; i < points.length; i++) { const [x, y, r] = points[i]; const p = puffs[i % 70];
    circ(x + (p.a - 0.5) * r * 0.6, y - p.b * r * 0.5, r * (0.7 + p.c * 0.5), p.d > 0.5 ? '#7a625c' : '#9a7a6c');
    circ(x + (p.b - 0.5) * r * 0.5, y + r * 0.25, r * 0.6, `rgba(255,${140 + (p.c * 60) | 0},60,0.55)`); }
  });
}

// ============================================================
//  SHOTS
// ============================================================
function camera(scale, x = 0, y = 0) { ctx.translate(W / 2 + x, H / 2 + y); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2); }
const SH = {};
SH.dawn = (t, lt, len) => {
  ctx.save(); camera(1 + 0.12 * ease(lt / len), 0, 40 * ease(lt / len));
  sky('#f6b27a', '#ffe3b8', 1250);
  circ(820, 1050, 80, '#fff3c8');
  vesuvius(560, 1200, 1.05, { t, smoke: true });
  town(1360); street(1360);
  for (const [x, c] of [[160, '#3a6fb0'], [860, '#6a8a3a']]) person(x, 1700, 0.75, { tunic: c, walk: t * 4, mood: 'calm', skin: x > 500 ? '#b47a52' : '#e0a57a' });
  ctx.restore();
};
SH.bakery = (t, lt, len) => {
  ctx.save(); camera(1.05 + 0.05 * ease(lt / len), -20 * lt, 0);
  blurred(5, () => bakeryBg(t));
  const pull = ease(clamp(lt / 1.2));
  person(640, 1760, 1.35, { tunic: '#e9e2d0', beard: true, hair: '#2a1a10', mood: 'happy', arms: [0.6, 0.9], look: [-1, 0] });
  // Brotschieber mit Brot
  ctx.save(); ctx.translate(lerp(380, 470, pull), 1430); ctx.rotate(-0.15); rect(0, -8, 330, 16, '#7a5530'); ell(-20, 0, 80, 40, '#9a6a3a'); loaf(-20, -30, 0.55); ctx.restore();
  for (let i = 0; i < 5; i++) { const k = (lt * 0.6 + i / 5) % 1; ctx.strokeStyle = `rgba(255,255,255,${0.3 * (1 - k)})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(360 + i * 30, 1380 - k * 200); ctx.quadraticCurveTo(380 + i * 30, 1330 - k * 200, 360 + i * 30, 1290 - k * 200); ctx.stroke(); }
  ctx.restore();
};
SH.dog = (t, lt, len) => {
  ctx.save(); camera(1 + 0.08 * ease(lt / len));
  blurred(14, () => { bakeryBg(t); person(760, 1700, 1.3, { tunic: '#e9e2d0', beard: true, mood: 'calm' }); });
  ell(540, 1720, 230, 60, '#7a4a2a'); ell(540, 1700, 190, 40, '#a8703c'); for (let i = 0; i < 8; i++) circ(470 + i * 20, 1696, 10, '#6a3a1a');   // Napf
  dogHead(540, 1260, 1.6, { mood: 'sad', look: [0.2, 0.6], collar: true, t, earsBack: true });
  ctx.restore();
};
SH.growl = (t, lt, len) => {
  ctx.save(); camera(1 + 0.1 * ease(lt / len), 0, -30 * ease(lt / len));
  sky('#9ac3e6', '#ffe8c8', 1200); vesuvius(560, 1260, 1.15, { t, smoke: true }); town(1420);
  // Türrahmen (vorne, unscharf)
  blurred(8, () => { rect(-100, -100, 220, H + 200, '#5a3a26'); rect(960, -100, 220, H + 200, '#5a3a26'); rect(-100, -100, W + 200, 220, '#4a2e1e'); });
  street(1420);
  const shake = Math.sin(t * 40) * 3;
  dogBody(380 + shake, 1720, 1.6, { growl: true, t, look: [0.6, -0.6], collar: false });
  for (let i = 0; i < 3; i++) { ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(700, 1380, 60 + i * 34 + (lt * 60) % 34, -0.8, 0.8); ctx.stroke(); }
  ctx.restore();
};
SH.quake = (t, lt, len) => {
  const sh = Math.sin(t * 55) * 10 + Math.sin(t * 31) * 6;
  ctx.save(); camera(1.1, sh, sh * 0.5);
  bakeryBg(t);
  // Regal mit Amphoren, die wackeln
  rect(120, 900, 840, 26, '#5a3a20');
  for (let i = 0; i < 5; i++) { ctx.save(); ctx.translate(200 + i * 170, 900); ctx.rotate(Math.sin(t * 30 + i) * 0.08); ell(0, -110, 55, 95, i % 2 ? '#b5653a' : '#c9824a'); rect(-22, -230, 44, 40, '#8a4a26'); ctx.restore(); }
  for (let i = 0; i < 40; i++) { const k = (lt * 0.9 + i / 40) % 1; circ(100 + (i * 137) % 880, k * 1500, 3 + (i % 3), 'rgba(230,210,180,0.7)'); }
  ctx.restore();
};
SH.shrug = (t, lt, len) => {
  ctx.save(); camera(1.05 - 0.05 * ease(lt / len));
  sky('#8fc0ea', '#fff0d0', 1250); vesuvius(560, 1200, 0.95, { t, smoke: true }); town(1360); street(1360);
  const sg = Math.max(0, Math.sin(lt * 4)) * 0.5;
  person(330, 1820, 1.15, { tunic: '#3a6fb0', mood: 'happy', arms: [-0.9 - sg, 0.9 + sg], look: [1, 0] });
  person(760, 1820, 1.15, { tunic: '#7a3a8a', skin: '#b47a52', hair: '#1a1010', mood: 'happy', arms: [-0.9 - sg, 0.9 + sg], look: [-1, 0] });
  ctx.restore();
};
SH.bang = (t, lt, len) => {
  const kick = 1 - clamp(lt / 0.6);
  ctx.save(); camera(1.05 + 0.06 * kick, Math.sin(t * 70) * 22 * kick, 0);
  sky('#7fb5e6', '#fff0d0', 1250);
  vesuvius(560, 1200, 0.95, { t });
  const b = ease(clamp((lt - 0.1) / 0.8)); if (b > 0) plume(560, 730, 300 * b, t);
  town(1360); street(1360);
  const turn = clamp((lt - 0.3) / 0.3);
  person(300, 1820, 1.15, { tunic: '#3a6fb0', mood: turn > 0.5 ? 'shock' : 'happy', arms: [0.9 * turn, -0.9 * turn], look: [0, -1] });
  person(780, 1820, 1.15, { tunic: '#7a3a8a', skin: '#b47a52', hair: '#1a1010', mood: turn > 0.5 ? 'shock' : 'happy', arms: [0.9 * turn, -0.9 * turn], look: [0, -1] });
  if (lt < 0.25) { ctx.fillStyle = `rgba(255,255,255,${1 - lt / 0.25})`; ctx.fillRect(-200, -200, W + 400, H + 400); }
  ctx.restore();
};
SH.plume = (t, lt, len) => {
  ctx.save(); camera(1.0 + 0.06 * ease(lt / len), 0, 60 * ease(lt / len));
  const d = ease(clamp(lt / len)) * 0.4;
  sky(mixc('#7fb5e6', '#6a6870', d), mixc('#fff0d0', '#c8b8a0', d), 1400);
  vesuvius(560, 1300, 0.7, { t, col: '#5a4a5a' });
  plume(560, 1000, lerp(500, 1000, ease(clamp(lt / len))), t);
  town(1500, { dark: d }); street(1500, { dark: d });
  for (let i = 0; i < 6; i++) person(140 + i * 160, 1780, 0.5, { tunic: ['#3a6fb0', '#7a3a8a', '#c9583a', '#3a8a5a', '#e9e2d0', '#8a6a3a'][i], mood: 'shock', look: [0, -1], arms: [1.2, -1.2] });
  ctx.restore();
};
SH.scale = (t, lt, len) => {
  ctx.save();
  sky('#3a3a48', '#8a7a70', 1700);
  const g = ease(clamp(lt / 0.8));
  // Skala
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(110, 1700); ctx.lineTo(110, 380); ctx.stroke();
  ctx.font = `900 34px ${UI}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  for (let km = 0; km <= 30; km += 5) { const y = 1700 - km * 44; ctx.fillRect(100, y - 2, 24, 4); ctx.fillText(km + ' km', 135, y + 12); }
  plume(560, 1700, 30 * 44 * g, t, { col: '#6a6268' });
  // Mount Everest zum Vergleich
  poly([[700, 1700], [840, 1700 - 8.8 * 44], [900, 1700 - 7.4 * 44], [1000, 1700]], '#e9edf2');
  ctx.font = `900 34px ${UI}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('Mount Everest', 850, 1750); ctx.fillText('8,8 km', 850, 1795);
  ctx.restore();
};
const stones = Array.from({ length: 90 }, () => ({ x: rr(-50, W + 50), y: rr(-1900, 0), r: rr(6, 18), v: rr(900, 1500) }));
SH.pumice = (t, lt, len) => {
  ctx.save(); camera(1.05, Math.sin(t * 20) * 4, 0);
  sky('#2a2428', '#5a4a48', 1300); town(1380, { dark: 0.7 }); street(1380, { dark: 0.7 });
  for (let i = 0; i < 4; i++) { const x = ((i * 300 + lt * 380) % 1400) - 200; person(x, 1760 + (i % 2) * 60, 0.95, { tunic: ['#3a6fb0', '#7a3a8a', '#c9583a', '#3a8a5a'][i], mood: 'shock', walk: t * 12 + i, pillow: true, arms: [1.6, -1.6], skin: i % 2 ? '#b47a52' : '#e0a57a' }); }
  for (const s of stones) { const y = (s.y + lt * s.v) % 2100; circ(s.x, y, s.r, '#c8bca8'); circ(s.x - s.r * 0.3, y - s.r * 0.3, s.r * 0.3, '#e8e0d0'); }
  ctx.restore();
};
SH.roof = (t, lt, len) => {
  ctx.save(); camera(1.1, Math.sin(t * 50) * 8 * (lt > 0.4 ? 1 : 0.3), 0);
  rect(-200, -200, W + 400, H + 400, '#3a2a26');
  const br = ease(clamp((lt - 0.4) / 0.5));
  // Balken + Ziegel brechen ein
  for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(140 + i * 160, 700 + br * (300 + i * 80)); ctx.rotate(br * (i % 2 ? 0.6 : -0.5)); rect(-80, -20, 160, 40, '#c2593a'); ctx.restore(); }
  ctx.save(); ctx.translate(540, 760 + br * 200); ctx.rotate(br * 0.35); rect(-520, -24, 1040, 48, '#6a4226'); ctx.restore();
  for (let i = 0; i < 60; i++) { const k = (lt * 0.8 + i / 60) % 1; circ((i * 97) % W, 500 + k * 1500 * br, 5 + (i % 4) * 3, '#c8bca8'); }
  for (let i = 0; i < 12; i++) { const k = clamp((lt - 0.5) / 0.9); ctx.fillStyle = `rgba(200,190,170,${0.5 * (1 - k)})`; circ(540 + Math.cos(i) * 400 * k, 1500 - Math.sin(i * 1.3) * 200 * k, 60 + 160 * k, ctx.fillStyle); }
  ctx.restore();
};
SH.run = (t, lt, len) => {
  ctx.save(); camera(1.15 + 0.1 * ease(lt / len), 0, 0);
  blurred(10, () => { bakeryBg(t); rect(-200, -200, W + 400, H + 400, 'rgba(20,10,10,0.5)'); });
  person(540 + lt * 90, 2050, 2.0, { tunic: '#e9e2d0', beard: true, mood: 'worried', walk: t * 10, arms: [0.8, -0.6], sweat: true, t, look: [-1, 0] });
  ctx.restore();
};
SH.chain = (t, lt, len) => {
  ctx.save(); camera(1.05 + 0.08 * ease(lt / len));
  blurred(12, () => { bakeryBg(t); rect(-200, -200, W + 400, H + 400, 'rgba(20,10,10,0.55)'); });
  // Kette von der Wand zum Halsband
  const pull = Math.sin(t * 9) * 12;
  ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 12;
  for (let i = 0; i < 10; i++) { const x = 60 + i * 48, y = 1640 + Math.sin(i * 0.8) * 10 + pull * (i / 10); ctx.beginPath(); ctx.ellipse(x, y, 26, 16, i % 2 ? 0 : Math.PI / 2 * 0.4, 0, 7); ctx.stroke(); }
  dogHead(640 + pull, 1320, 1.45, { mood: 'sad', look: [-0.6, -0.2], collar: true, t, earsBack: true });
  ctx.restore();
};
SH.flow = (t, lt, len) => {
  ctx.save(); camera(1.0 + 0.05 * ease(lt / len));
  sky('#3a2a2a', '#c86a3a', 1350);
  vesuvius(560, 1250, 1.0, { col: '#3a2a30' });
  // Glutwolke rast den Hang hinab (beide Flanken)
  const k = ease(clamp(lt / len)), front = lerp(0.12, 1.0, k), pts = [];
  for (let i = 0; i < 34; i++) { const f = i / 33; if (f > front) break; pts.push([lerp(500, 1120, f) + Math.sin(i * 2.3 + t * 3) * 20, lerp(800, 1440, f), 60 + f * 120]); pts.push([lerp(620, -40, f) + Math.cos(i * 1.7 + t * 3) * 20, lerp(800, 1440, f), 60 + f * 120]); }
  pyroFlow(pts, t);
  town(1500, { dark: 0.6 }); street(1500, { dark: 0.6 });
  ctx.restore();
};
SH.flee = (t, lt, len) => {
  ctx.save(); camera(1.1, Math.sin(t * 30) * 6, 0);
  sky('#2a1a1a', '#e07a3a', 1400);
  blurred(9, () => { const pts = []; for (let i = 0; i < 26; i++) pts.push([(i * 61 + lt * 140) % 1400 - 160, 1000 + Math.sin(i * 1.3) * 160, 170]); pyroFlow(pts, t); town(1450, { dark: 0.75 }); });
  street(1450, { dark: 0.7 });
  // Marcus trägt Felix
  const bob = Math.abs(Math.sin(t * 10)) * 16;
  person(560, 1850 - bob, 1.55, { tunic: '#e9e2d0', beard: true, mood: 'worried', walk: t * 12, arms: [1.3, -1.3], sweat: true, t, look: [1, 0] });
  dogHead(600, 1450 - bob, 0.55, { mood: 'sad', look: [-0.5, 0], collar: true, t });
  for (let i = 0; i < 8; i++) { ctx.strokeStyle = 'rgba(255,230,200,0.6)'; ctx.lineWidth = 5; const y = 1100 + i * 90; ctx.beginPath(); ctx.moveTo(60 + ((lt * 900 + i * 130) % 300), y); ctx.lineTo(260 + ((lt * 900 + i * 130) % 300), y); ctx.stroke(); }
  ctx.restore();
};
SH.end = (t, lt, len) => {
  // Standbild der Flucht, entsättigt
  layer(1, () => SH.flee(T.end, 0.1, 1), 'grayscale(0.9) brightness(0.55)');
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  const k1 = backOut(clamp((lt - 0.1) / 0.4));
  if (k1 > 0) { ctx.save(); ctx.translate(540, 820); ctx.scale(k1, k1); capText([['SCHAFFEN ES', '#fff'], ['DIE BEIDEN?', '#ff3b30']], 0, 0, 150, true); ctx.restore(); }
  const k2 = clamp((lt - 1.3) / 0.4);
  if (k2 > 0) { ctx.save(); ctx.globalAlpha = k2; rrect(130, 1120, 820, 110, 55, '#fff'); ctx.fillStyle = '#111'; ctx.font = `900 50px ${UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Schreibt es in die Kommentare', 540, 1176); ctx.restore(); }
  const k3 = clamp((lt - 2.0) / 0.4);
  if (k3 > 0) { ctx.save(); ctx.globalAlpha = k3; ctx.font = `64px ${CAP}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffb020'; ctx.fillText('TEIL 2 FOLGT', 540, 1330); ctx.restore(); }
};

// ============================================================
//  TEXT: Untertitel (2–3 Wörter) + REAL-Schild
// ============================================================
function capText(lines, x, y, size, stacked = false) {
  ctx.font = `${size}px ${CAP}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach(([txt, col], i) => {
    const yy = y + (stacked ? (i - (lines.length - 1) / 2) * size * 1.1 : 0);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.12; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(txt, x, yy); ctx.restore();
    ctx.fillStyle = col; ctx.fillText(txt, x, yy);
  });
}
function drawCaption(t) {
  for (const c of CAPTIONS) {
    const [t0, t1, words, pos] = c; if (t < t0 || t >= t1) continue;
    const k = backOut(clamp((t - t0) / 0.12));
    const shot = shotOf(t); const TOP = ['dog', 'growl', 'chain', 'run', 'flee', 'bakery'];
    const y = (pos === 'top' || TOP.includes(shot)) ? 470 : 1420, size = 108;
    ctx.save(); ctx.translate(540, y); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k);
    ctx.font = `${size}px ${CAP}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const parts = words.map(w => ({ txt: w.replace(/\*/g, ''), hi: w.includes('*') }));
    const sp = ctx.measureText(' ').width; const widths = parts.map(p => ctx.measureText(p.txt).width);
    let total = widths.reduce((a, b) => a + b, 0) + sp * (parts.length - 1); const sc = Math.min(1, 980 / total);
    ctx.scale(sc, sc); let x = -total / 2;
    parts.forEach((p, i) => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 6; ctx.lineJoin = 'round'; ctx.lineWidth = 13; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(p.txt, x, 0); ctx.restore();
      ctx.fillStyle = p.hi ? '#ff3b30' : '#ffffff'; ctx.fillText(p.txt, x, 0); x += widths[i] + sp;
    });
    ctx.restore();
  }
}
function drawReal(t) {
  for (const [a, b, txt] of REAL) {
    if (t < a || t > b) continue;
    const k = easeOut(clamp((t - a) / 0.3)) * (1 - clamp((t - (b - 0.2)) / 0.2));
    ctx.save(); ctx.globalAlpha = k; ctx.translate(-30 * (1 - k), 0);
    ctx.font = `800 34px ${UI}`; const tw = ctx.measureText(txt).width;
    const w = tw + 150, x = 40, y = 190;
    rrect(x, y, w, 64, 32, 'rgba(250,248,240,0.95)'); ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, y, w, 64, 32); ctx.stroke();
    rrect(x + 10, y + 10, 96, 44, 22, '#1f8f4e'); ctx.fillStyle = '#fff'; ctx.font = `900 26px ${UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('REAL', x + 58, y + 33);
    ctx.fillStyle = '#1a1a1a'; ctx.font = `800 34px ${UI}`; ctx.textAlign = 'left'; ctx.fillText(txt, x + 124, y + 34);
    ctx.restore();
  }
}

// ---------- main ----------
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const s = shotOf(t), lt = t - T[s], len = nextT(s) - T[s];
  SH[s](t, lt, len);
  // weicher Schnitt: kurzes Abdunkeln am Shot-Anfang
  if (lt < 0.12 && s !== 'dawn' && s !== 'bang') { ctx.fillStyle = `rgba(0,0,0,${0.6 * (1 - lt / 0.12)})`; ctx.fillRect(0, 0, W, H); }
  if (t < 0.35) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.35})`; ctx.fillRect(0, 0, W, H); }
  // Vignette + feines Korn
  const vg = ctx.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawReal(t);
  if (s !== 'end') drawCaption(t);
}
window.renderFrame = renderFrame;
window.setCaptions = c => { CAPTIONS = c; };
if (!location.hash.includes('render')) { const st = performance.now(); (function loop() { renderFrame(((performance.now() - st) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); }
Promise.all([document.fonts.load(`100px Anton`), document.fonts.load(`900 100px Inter`)]).then(() => { window.READY = true; });
</script>
