<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ein Tag als Gladiator</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  "Ein Tag als Gladiator im alten Rom"  – Format: Ein Tag als …
//  renderFrame(t) zeichnet das Bild zur Video-Zeit t (Sekunden).
// ============================================================
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const FONT = '"Inter", "Inter Display", sans-serif';

// Szenen-Schnitte (Video-Zeit), getimt auf den Sprechertext (lines.json)
const B = [0, 3.94, 8.84, 16.45, 23.16, 33.87, 38.56];   // getimt auf Brian (sprecher_brian.mp3, Pausen gekürzt)
const S = { hook: [B[0], B[1]], s6: [B[1], B[2]], s12: [B[2], B[3]], s15: [B[3], B[4]], judge: [B[4], B[5]], outro: [B[5], B[6]] };
// Einstellungen innerhalb der Szenen
const GATE = 2.58;                 // Hook: Kamera fährt aufs Tor
const TRAIN = 6.21;                // "Training mit dem Holzschwert"
const GERSTEN = 12.53;            // "Gerstenfresser"
const ASH = 13.56;                 // "Dazu ein Trank aus Asche"
const GATEOPEN = 17.54;            // "Das Tor öffnet sich"
const ARENA = 18.97, FOE = 20.8;   // "Fünfzigtausend Menschen schreien" / "Dein Gegner"
const FALL = 24.36;                // "... und du liegst im Sand" (Zeitlupe)
const THUMB = 25.31, ALIVE = 27.11, COINS = 29.32, STAR = 30.84;
const WIPES = [TRAIN, ASH, ARENA, THUMB, COINS, STAR];
window.DURATION = B[6];

const SCENES = [
  { key: 's6', pre: '', big: '06:00 UHR', node: '06:00', place: 'GLADIATORENSCHULE',
    facts: [{ at: 0.8, text: 'Aufstehen in der *Gladiatorenschule*.' }, { at: TRAIN - B[1] + 0.1, text: 'Training mit dem *Holzschwert* – stundenlang.' }] },
  { key: 's12', pre: '', big: '12:00 UHR', node: '12:00', place: 'ESSEN',
    facts: [{ at: 1.0, text: '*Gerstenbrei* und Bohnen.' }, { at: ASH - B[2] + 0.1, text: 'Dazu ein Trank aus *Asche* – für starke Knochen.' }] },
  { key: 's15', pre: '', big: '15:00 UHR', node: '15:00', place: 'KOLOSSEUM, ROM',
    facts: [{ at: GATEOPEN - B[3], text: 'Das *Tor* öffnet sich.' }, { at: ARENA - B[3] + 0.1, text: '*50.000* Menschen schreien.' }, { at: FOE - B[3] + 0.1, text: 'Dein Gegner: *Netz und Dreizack.*' }] },
  { key: 'judge', pre: '16:00 UHR', big: 'DAS URTEIL', node: 'Urteil', place: 'ARENA',
    facts: [{ at: 1.2, text: 'Ein Fehler – und du liegst im *Sand*.' }, { at: THUMB - B[4] + 0.1, text: 'Jetzt entscheidet das *Publikum*.' }, { at: ALIVE - B[4] + 0.05, text: 'Doch die meisten Kämpfe endeten *nicht tödlich*.' },
            { at: COINS - B[4] + 0.1, text: 'Gladiatoren waren *teuer*.' }, { at: STAR - B[4] + 0.1, text: 'Wer mutig kämpfte: gefeiert wie ein *Star*.' }] },
];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, k) { return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)]; }
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(146); const rr = (a, b) => lerp(a, b, R());
const GOLD = '#ffc233', RED = '#d9302c';

// ============================================================
//  FIGUREN
// ============================================================
const SKIN = '#c98b5e', SKIN_D = '#a8693f', CLOTH = '#e9e0cc', BELT = '#7a4a22', METAL = '#c9ccd2', METAL_D = '#8a8f99';
function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
// type: 'murmillo' (Schwert, Schild, Helm) | 'retiarius' (Netz, Dreizack) | 'trainee' (Holzschwert) | 'referee'
function gladiator(x, y, s, o = {}) {
  const type = o.type || 'murmillo', f = o.face || 1, arm = o.arm ?? 0, walk = o.walk || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  const lg = Math.sin(walk) * 14;
  // Beine
  limb(-14, -95, -20 - lg, 0, 22, SKIN); limb(14, -95, 20 + lg, 0, 22, SKIN);
  if (type === 'murmillo') { ctx.fillStyle = METAL; ctx.fillRect(-32 - lg, -48, 22, 44); }   // Beinschiene
  // Lendenschurz + Gürtel
  ctx.fillStyle = type === 'referee' ? '#f4f0e6' : CLOTH; ctx.beginPath(); ctx.moveTo(-34, -120); ctx.lineTo(34, -120); ctx.lineTo(28, -78); ctx.lineTo(-28, -78); ctx.fill();
  ctx.fillStyle = BELT; ctx.fillRect(-36, -126, 72, 14);
  // Oberkörper
  if (type === 'referee') { ctx.fillStyle = '#f4f0e6'; ctx.beginPath(); ctx.roundRect(-36, -230, 72, 120, 16); ctx.fill(); ctx.fillStyle = RED; ctx.fillRect(-36, -230, 12, 120); }
  else { ctx.fillStyle = SKIN; ctx.beginPath(); ctx.roundRect(-38, -230, 76, 112, 22); ctx.fill(); ctx.strokeStyle = SKIN_D; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -215); ctx.lineTo(0, -150); ctx.moveTo(-20, -180); ctx.quadraticCurveTo(0, -172, 20, -180); ctx.stroke(); }
  // Schwert-/Waffenarm (vorn)
  const sa = -0.6 + arm;  // Winkel
  const hx = 34 + Math.cos(sa) * 70, hy = -205 + Math.sin(sa) * 70;
  limb(30, -210, hx, hy, 20, SKIN);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(sa);
  if (type === 'murmillo') { ctx.fillStyle = METAL; ctx.fillRect(0, -7, 78, 14); ctx.fillStyle = METAL_D; ctx.beginPath(); ctx.moveTo(78, -7); ctx.lineTo(96, 0); ctx.lineTo(78, 7); ctx.fill(); ctx.fillStyle = '#5a3a1a'; ctx.fillRect(-14, -12, 16, 24); }
  if (type === 'trainee') { ctx.fillStyle = '#9a6a3a'; ctx.fillRect(0, -8, 84, 16); ctx.fillStyle = '#6a4422'; ctx.fillRect(-14, -12, 16, 24); }
  if (type === 'retiarius') { ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-90, 0); ctx.lineTo(130, 0); ctx.stroke(); ctx.strokeStyle = METAL; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(130, -24); ctx.lineTo(130, 24); for (const d of [-24, 0, 24]) { ctx.moveTo(130, d); ctx.lineTo(165, d); } ctx.stroke(); }
  if (type === 'referee') { ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(110, 0); ctx.stroke(); }
  ctx.restore();
  // Kopf
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(0, -262, 30, 0, 7); ctx.fill();
  if (type === 'murmillo') {
    ctx.fillStyle = METAL; ctx.beginPath(); ctx.arc(0, -266, 36, Math.PI, 0); ctx.lineTo(48, -252); ctx.lineTo(-48, -252); ctx.fill();
    ctx.fillStyle = METAL_D; for (let i = -2; i <= 2; i++) ctx.fillRect(i * 10 - 2, -262, 4, 26);
    ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(-30, -298); ctx.quadraticCurveTo(0, -350, 34, -300); ctx.quadraticCurveTo(0, -320, -30, -298); ctx.fill();
  } else if (type === 'referee') { ctx.fillStyle = '#d8d0c0'; ctx.beginPath(); ctx.arc(0, -276, 26, Math.PI, 0); ctx.fill(); }
  else { ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(0, -272, 30, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); ctx.fillStyle = '#1a1010'; ctx.beginPath(); ctx.arc(10, -264, 4, 0, 7); ctx.fill(); }
  // Hinterer Arm: Schild / Netz / freie Hand
  if (type === 'murmillo') {
    limb(-30, -210, -50, -160, 20, SKIN);
    ctx.fillStyle = RED; ctx.beginPath(); ctx.roundRect(-100, -250, 80, 150, 12); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 5; ctx.strokeRect(-92, -240, 64, 130); ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(-60, -175, 12, 0, 7); ctx.fill();
  } else if (type === 'retiarius') {
    ctx.fillStyle = METAL; ctx.beginPath(); ctx.moveTo(-40, -235); ctx.lineTo(-10, -265); ctx.lineTo(-8, -225); ctx.fill();   // Schulterschutz
    const nx = -70 + (o.net || 0) * -40, ny = -150;
    limb(-30, -210, nx, ny, 20, SKIN);
    ctx.strokeStyle = 'rgba(230,220,190,0.9)'; ctx.lineWidth = 3;
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(nx, ny); ctx.quadraticCurveTo(nx - 40 - i * 8, ny + 60, nx - 20 + i * 10 - 40, ny + 140); ctx.stroke(); }
    for (let j = 1; j < 5; j++) { ctx.beginPath(); ctx.moveTo(nx - 30 - j * 10, ny + j * 28); ctx.lineTo(nx + 10 - j * 4, ny + j * 28); ctx.stroke(); }
  } else limb(-30, -210, -56, -140 + Math.sin(walk + 1) * 10, 20, SKIN);
  ctx.restore();
}

// ============================================================
//  SHOTS
// ============================================================
function sandGrad(top, bot) { const g = ctx.createLinearGradient(0, top, 0, bot); g.addColorStop(0, '#e2c08a'); g.addColorStop(1, '#b88a52'); return g; }
// --- Hook: Kolosseum von außen ---
function colosseumFacade(cx, base, wid, hgt, light) {
  const tiers = 4;
  for (let i = 0; i < tiers; i++) {
    const y0 = base - hgt * (i + 1) / tiers, h = hgt / tiers;
    ctx.fillStyle = rgb(mix(hex('#8a6a44'), hex('#e3c48e'), light * (0.8 + i * 0.05))); ctx.fillRect(cx - wid / 2, y0, wid, h);
    ctx.fillStyle = 'rgba(60,40,25,0.5)'; ctx.fillRect(cx - wid / 2, y0, wid, 10);
    if (i < 3) { const n = 13, aw = wid / n; for (let k = 0; k < n; k++) { const ax = cx - wid / 2 + k * aw + aw * 0.18; ctx.fillStyle = 'rgba(35,22,14,0.85)'; ctx.beginPath(); ctx.moveTo(ax, y0 + h); ctx.lineTo(ax, y0 + h * 0.42); ctx.arc(ax + aw * 0.32, y0 + h * 0.42, aw * 0.32, Math.PI, 0); ctx.lineTo(ax + aw * 0.64, y0 + h); ctx.fill(); } }
    else { ctx.fillStyle = 'rgba(35,22,14,0.5)'; for (let k = 0; k < 26; k++) ctx.fillRect(cx - wid / 2 + 20 + k * wid / 26, y0 + h * 0.35, 12, 26); }
  }
}
function hookShot(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, 1500); sky.addColorStop(0, '#2a3f7a'); sky.addColorStop(0.6, '#f08a4b'); sky.addColorStop(1, '#ffd08a'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const sg = ctx.createRadialGradient(820, 1150, 20, 820, 1150, 500); sg.addColorStop(0, 'rgba(255,230,160,0.9)'); sg.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = sg; ctx.fillRect(320, 650, 1000, 1000);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = `rgba(40,30,50,${0.6})`; const x = (i * 260 + t * 120) % 1500 - 200; ctx.beginPath(); ctx.moveTo(x, 700 + (i % 3) * 60); ctx.lineTo(x + 18, 690 + (i % 3) * 60); ctx.lineTo(x + 36, 700 + (i % 3) * 60); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,30,50,0.7)'; ctx.stroke(); }
  const z = 1 + 2.6 * easeIn(inv(GATE, B[1], t));
  ctx.save(); ctx.translate(W / 2, 1480); ctx.scale(z, z); ctx.translate(-W / 2, -1480);
  colosseumFacade(W / 2, 1600, 1500, 820, 0.85);
  ctx.fillStyle = '#c7a06a'; ctx.fillRect(-500, 1600, 2100, 400);
  // Fackeln
  for (const fx of [300, 780]) { ctx.fillStyle = '#5a3a1a'; ctx.fillRect(fx - 6, 1480, 12, 120); const fl = 1 + 0.2 * Math.sin(t * 20 + fx); ctx.fillStyle = 'rgba(255,170,40,0.95)'; ctx.beginPath(); ctx.ellipse(fx, 1468, 16 * fl, 30 * fl, 0, 0, 7); ctx.fill(); }
  // Silhouetten von Menschen vor dem Kolosseum
  for (let i = 0; i < 10; i++) { const x = (i * 123 + t * (i % 2 ? 30 : -25)) % 1200 - 60; ctx.fillStyle = 'rgba(30,20,20,0.75)'; ctx.beginPath(); ctx.arc(x, 1580, 12, 0, 7); ctx.fill(); ctx.fillRect(x - 10, 1592, 20, 46); }
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${0.85 * inv(B[1] - 0.6, B[1], t)})`; ctx.fillRect(0, 0, W, H);
}
function easeIn(k) { return k * k * k; }
// --- Zelle ---
function cellShot(t) {
  const lt = t - B[1];
  ctx.fillStyle = '#2a2420'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < 1700; y += 70) for (let x = (y / 70) % 2 ? -60 : 0; x < W; x += 120) { ctx.fillStyle = `rgba(${70 + (x * y) % 30},${58 + (x + y) % 20},${48},1)`; ctx.fillRect(x + 4, y + 4, 112, 62); }
  // Fenster mit Gitter + Lichtstrahl
  const dawn = ease(inv(B[1], TRAIN, t));
  ctx.fillStyle = rgb(mix(hex('#3a4a7a'), hex('#ffd59a'), dawn)); ctx.fillRect(700, 820, 220, 160);
  ctx.fillStyle = '#1a1410'; for (let i = 0; i < 5; i++) ctx.fillRect(712 + i * 46, 820, 12, 160);
  ctx.fillStyle = `rgba(255,220,150,${0.18 + 0.2 * dawn})`; ctx.beginPath(); ctx.moveTo(700, 980); ctx.lineTo(920, 980); ctx.lineTo(700, 1750); ctx.lineTo(260, 1750); ctx.fill();
  for (let i = 0; i < 30; i++) { const k = (i * 0.137 + t * 0.05) % 1; ctx.fillStyle = 'rgba(255,240,200,0.5)'; ctx.beginPath(); ctx.arc(lerp(760, 420, k) + Math.sin(i + t) * 40, lerp(1000, 1700, (i * 0.31) % 1), 2.5, 0, 7); ctx.fill(); }
  // Kette an der Wand
  ctx.strokeStyle = '#6a6a70'; ctx.lineWidth = 6; for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.ellipse(160, 900 + i * 32, 10, 16, 0, 0, 7); ctx.stroke(); }
  // Fackel
  ctx.fillStyle = '#5a3a1a'; ctx.fillRect(980, 1000, 14, 110); const fl = 1 + 0.25 * Math.sin(t * 23); const tg = ctx.createRadialGradient(987, 985, 5, 987, 985, 260); tg.addColorStop(0, 'rgba(255,160,50,0.5)'); tg.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = tg; ctx.fillRect(727, 725, 520, 520); ctx.fillStyle = '#ffb030'; ctx.beginPath(); ctx.ellipse(987, 985, 15 * fl, 28 * fl, 0, 0, 7); ctx.fill();
  // Boden + Strohlager
  ctx.fillStyle = '#3a2e24'; ctx.fillRect(0, 1700, W, 220);
  ctx.fillStyle = '#c9a34e'; ctx.beginPath(); ctx.ellipse(420, 1720, 380, 60, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a8842e'; ctx.lineWidth = 3; for (let i = 0; i < 40; i++) { const x = 60 + i * 18; ctx.beginPath(); ctx.moveTo(x, 1690 + (i % 4) * 8); ctx.lineTo(x + 30, 1700 + (i % 3) * 10); ctx.stroke(); }
  // Gladiator setzt sich auf und streckt sich
  const up = ease(inv(B[1] + 0.3, B[1] + 1.4, t));
  ctx.save(); ctx.translate(420, 1700); ctx.rotate(lerp(-1.35, 0, up));
  gladiator(0, 0, 1.25, { type: 'trainee', arm: lerp(0.4, -1.6 + Math.sin(lt * 3) * 0.2, up), walk: 0 });
  ctx.restore();
  if (up > 0.95) strokeText('*gähn*', 560, 1180, 54, '#fff', 800, 10);
}
// --- Training am Pfahl ---
const trainees = Array.from({ length: 5 }, (_, i) => ({ x: 100 + i * 210, ph: rr(0, 6) }));
function trainingShot(t) {
  const lt = t - TRAIN;
  const sky = ctx.createLinearGradient(0, 0, 0, 1300); sky.addColorStop(0, '#6fb2e8'); sky.addColorStop(1, '#ffe2b0'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // Mauern der Schule
  ctx.fillStyle = '#c9a473'; ctx.fillRect(0, 1060, W, 300); ctx.fillStyle = '#a6825a'; for (let x = 0; x < W; x += 90) ctx.fillRect(x, 1060, 8, 300);
  ctx.fillStyle = 'rgba(80,50,30,0.6)'; for (let x = 40; x < W; x += 180) { ctx.beginPath(); ctx.moveTo(x, 1360); ctx.lineTo(x, 1180); ctx.arc(x + 40, 1180, 40, Math.PI, 0); ctx.lineTo(x + 80, 1360); ctx.fill(); }
  ctx.fillStyle = sandGrad(1340, H); ctx.fillRect(0, 1340, W, H - 1340);
  // Andere Schüler im Hintergrund
  for (const tr of trainees) gladiator(tr.x, 1420, 0.55, { type: 'trainee', arm: Math.sin(t * 6 + tr.ph) * 0.9, face: tr.x > 540 ? -1 : 1 });
  // Ausbilder mit Peitsche
  gladiator(900, 1560, 0.85, { type: 'referee', arm: -0.3 + Math.sin(t * 2) * 0.15, face: -1 });
  // Pfahl
  ctx.fillStyle = '#7a5530'; ctx.fillRect(640, 1380, 56, 360); ctx.fillStyle = '#5a3a1e'; for (let y = 1400; y < 1740; y += 40) ctx.fillRect(640, y, 56, 5);
  // Hauptfigur schlägt im Takt
  const sw = (lt * 2.6) % 1, armA = sw < 0.55 ? lerp(-2.2, 0.5, ease(sw / 0.55)) : lerp(0.5, -2.2, (sw - 0.55) / 0.45);
  gladiator(450, 1780, 1.25, { type: 'trainee', arm: armA, walk: 0.3 });
  if (sw > 0.5 && sw < 0.7) { const k = (sw - 0.5) / 0.2; for (let i = 0; i < 9; i++) { ctx.fillStyle = `rgba(230,200,150,${1 - k})`; ctx.beginPath(); ctx.arc(640 + Math.cos(i) * 60 * k, 1520 + Math.sin(i * 1.7) * 60 * k, 10 * (1 - k) + 4, 0, 7); ctx.fill(); } strokeText('ZACK!', 800, 1330, 64, '#fff', 900, 12); }
  // Sonnen-Uhr-Gefühl: Schatten wandert (stundenlang)
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(668 + lerp(-120, 120, inv(TRAIN, B[2], t)), 1745, 90, 14, 0, 0, 7); ctx.fill();
}
// --- Gerstenbrei ---
const beans = Array.from({ length: 22 }, () => ({ a: rr(0, 6.28), r: rr(0, 170), rot: rr(0, 3) }));
function bowlShot(t) {
  const lt = t - B[2];
  ctx.fillStyle = '#6a4426'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(40,24,12,0.4)'; ctx.lineWidth = 4; for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y + Math.sin(y) * 10); ctx.lineTo(W, y + 20); ctx.stroke(); }
  const cx = 540, cy = 1250, z = 1 + 0.08 * ease(inv(B[2], ASH, t));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(16, 30, 340, 300, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#9c5a32'; ctx.beginPath(); ctx.ellipse(0, 0, 340, 300, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e4cf9c'; ctx.beginPath(); ctx.ellipse(0, 0, 280, 240, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(200,170,110,0.6)'; for (let i = 0; i < 70; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2.4) * (i * 3.6), Math.sin(i * 2.4) * (i * 3.0), 6, 0, 7); ctx.fill(); }
  for (const b of beans) { ctx.save(); ctx.translate(Math.cos(b.a) * b.r, Math.sin(b.a) * b.r * 0.85); ctx.rotate(b.rot); ctx.fillStyle = '#7a3a24'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(-5, -4, 6, 3, 0, 0, 7); ctx.fill(); ctx.restore(); }
  // Löffel taucht ein
  const sp = Math.sin(lt * 2.5);
  ctx.save(); ctx.translate(150 + sp * 30, -60 + sp * 20); ctx.rotate(-0.7); ctx.fillStyle = '#b08850'; ctx.fillRect(0, -10, 330, 20); ctx.beginPath(); ctx.ellipse(-10, 0, 50, 34, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.restore();
  // Dampf
  for (let i = 0; i < 8; i++) { const k = (lt * 0.5 + i / 8) % 1; ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - k)})`; ctx.lineWidth = 12; ctx.beginPath(); const x0 = 380 + i * 45; ctx.moveTo(x0, 1050 - k * 300); ctx.quadraticCurveTo(x0 + 30 * Math.sin(t * 2 + i), 1000 - k * 300, x0, 950 - k * 300); ctx.stroke(); }
  // Etiketten
  const la = inv(B[2] + 1.2, B[2] + 1.5, t) * (1 - inv(GERSTEN - 0.2, GERSTEN, t));
  if (la > 0) { ctx.save(); ctx.globalAlpha = la; tag('GERSTE', 200, 1560, '#e4cf9c', '#3a2a10'); tag('BOHNEN', 640, 1600, '#7a3a24', '#fff'); ctx.restore(); }
  // Stempel GERSTENFRESSER
  const gk = t - GERSTEN;

}
function drawTimeline(t) {
  const a = inv(B[1] - 0.2, B[1] + 0.3, t) * (1 - inv(B[5], B[5] + 0.4, t)); if (a <= 0) return;
  const y = 230, x0 = 150, x1 = 930;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(x0 - 60, y - 50, x1 - x0 + 120, 120, 40); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.strokeStyle = GOLD; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, inv(B[1], B[5], t)), y); ctx.stroke();
  SCENES.forEach((sc, i) => {
    const nx = lerp(x0, x1, i / 3), reached = t >= S[sc.key][0], active = reached && t < S[sc.key][1];
    ctx.fillStyle = reached ? GOLD : '#3a3f55'; ctx.beginPath(); ctx.arc(nx, y, 16 * (active ? 1 + 0.12 * Math.sin(t * 8) : 1), 0, 7); ctx.fill();
    ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = reached ? '#fff' : 'rgba(255,255,255,0.5)'; ctx.fillText(sc.node, nx, y + 44);
  });
  ctx.restore();
}
function drawSceneText(t, sc) {

  const inK = clamp(lt / 0.35), moveK = ease(inv(0.8, 1.15, lt)), outK = inv(t1 - t0 - 0.3, t1 - t0, lt);
  const cy = lerp(880, 440, moveK), size = lerp(170, 115, moveK), s0 = lerp(2.4, 1, easeOut(inK));
  ctx.save(); ctx.globalAlpha = clamp(inK * 2) * (1 - outK); ctx.translate(W / 2, cy); ctx.scale(s0, s0);
  if (sc.pre) strokeText(sc.pre, 0, -size * 0.74, size * 0.3, '#fff', 800, 10);
  ctx.font = `900 ${size}px ${FONT}`; const gr = ctx.createLinearGradient(0, -size / 2, 0, size / 2); gr.addColorStop(0, '#fff3c4'); gr.addColorStop(1, '#ffb000');
  strokeText(sc.big, 0, 0, size, gr, 900, 22); ctx.restore();
  // Ort-Pille
  const ck = inv(1.0, 1.3, lt) * (1 - outK);
  if (ck > 0) {
    const label = sc.place;
    ctx.save(); ctx.globalAlpha = ck; ctx.font = `800 40px ${FONT}`; const tw = ctx.measureText(label).width + 90;
    ctx.fillStyle = 'rgba(217,48,44,0.95)'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, 525, tw, 64, 32); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W / 2 - tw / 2 + 34, 557, 9, 0, 7); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, W / 2 - tw / 2 + 56, 559); ctx.restore();
  }
  sc.facts.forEach((f, i) => {
    const next = sc.facts[i + 1];
    const out = next ? inv(next.at - 0.25, next.at, lt) : outK;
    drawFact(f.text, lt - f.at, 780, out);
  });
}
function drawHook(t) {
  if (t > B[1] + 0.1) return;
  const out = inv(B[1] - 0.35, B[1], t);
  ctx.save(); ctx.globalAlpha = 1 - out;
  const k1 = backOut(clamp((t - 0.05) / 0.25)), k2 = backOut(clamp((t - 0.25) / 0.25)), k3 = backOut(clamp((t - 0.9) / 0.4));
  if (k1 > 0) { ctx.save(); ctx.translate(540, 380); ctx.scale(k1, k1); strokeText('EIN TAG ALS', 0, 0, 100, '#fff', 900, 18); ctx.restore(); }
  if (k2 > 0) { ctx.save(); ctx.translate(540, 520); ctx.scale(k2, k2); ctx.font = `900 150px ${FONT}`; const gr = ctx.createLinearGradient(0, -80, 0, 80); gr.addColorStop(0, '#fff3c4'); gr.addColorStop(1, '#ffb000'); strokeText('GLADIATOR', 0, 0, 148, gr, 900, 24); ctx.restore(); }
  if (k3 > 0) { ctx.save(); ctx.translate(540, 650); ctx.scale(k3, k3); strokeText('im alten Rom', 0, 0, 70, '#fff', 800, 14); ctx.restore(); }
  const k4 = backOut(clamp((t - GATE) / 0.35));
  if (k4 > 0) { ctx.save(); ctx.translate(540 + Math.sin(t * 60) * 3 * inv(GATE + 0.3, GATE + 0.5, t), 800); ctx.scale(k4, k4); strokeText('Würdest DU überleben?', 0, 0, 78, '#ff4d5e', 900, 16); ctx.restore(); }
  ctx.restore();
}
function drawOutro(t) {
  const lt = t - B[5]; if (lt < 0) return;
  ctx.save();
  const items = [['UND IHR?', 450, 80, GOLD], ['Würdet ihr', 590, 100, '#fff'], ['EINEN TAG', 735, 150, GOLD], ['ÜBERLEBEN?', 890, 150, '#ff3b3b']];
  items.forEach(([txt, y, sz, col], i) => { const k = backOut(clamp((lt - 0.1 - i * 0.25) / 0.4)); if (k <= 0) return; ctx.save(); ctx.translate(W / 2 + (i === 3 ? Math.sin(t * 50) * 3 * inv(1.0, 1.2, lt) : 0), y); ctx.scale(k, k); strokeText(txt, 0, 0, sz, col, 900, 22); ctx.restore(); });
  // Schwerthieb über die Frage
  const sl = clamp((lt - 1.05) / 0.2); if (sl > 0 && sl < 1) { ctx.strokeStyle = `rgba(255,255,255,${1 - sl * 0.5})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-50, 1000); ctx.lineTo(lerp(-50, 1130, sl), lerp(1000, 760, sl)); ctx.stroke(); }
  const k3 = clamp((lt - 1.3) / 0.4);
  if (k3 > 0) {
    ctx.globalAlpha = k3; const bob = Math.sin(lt * 6) * 10;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(W / 2 - 410, 1060 + bob, 820, 110, 55); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = `900 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Schreib’s in die Kommentare', W / 2, 1117 + bob);
  }
  const k4 = clamp((lt - 2.1) / 0.4); if (k4 > 0) { ctx.globalAlpha = k4; strokeText('Folge für den nächsten Tag', W / 2, 1250, 54, '#fff', 800, 12); }
  ctx.restore();
}

// ---------- fx ----------
const CUTS = [B[1], B[2], B[3], B[4], B[5]];
function flash(t) { let m = 0; for (const c of CUTS) { const d = t - c; if (d >= -0.06 && d < 0.4) m = Math.max(m, d < 0 ? 1 + d / 0.06 : 1 - d / 0.4); } return clamp(m); }
function shake(t) {
  let m = 0; for (const c of [...CUTS, GERSTEN, FOE + 1.1, 0.05, 0.25, 0.5, FALL + 0.5, ALIVE]) { const d = t - c; if (d >= 0 && d < 0.5) m = Math.max(m, 1 - d / 0.5); }
  if (t > B[4] && t < FALL) m = Math.max(m, 0.6);
  if (t > TRAIN && t < B[2]) { const sw = ((t - TRAIN) * 2.6) % 1; if (sw > 0.5 && sw < 0.65) m = Math.max(m, 0.4); }
  return m;
}
function zoomAt(t) { let base = 1; for (const k in S) { const [a, b] = S[k]; if (t >= a && t < b) base = 1 + 0.05 * ease(inv(a, b, t)); } let p = 0; for (const c of [...CUTS, ...WIPES]) { const d = t - c; if (d >= 0 && d < 0.5) p = Math.max(p, 0.07 * (1 - easeOut(d / 0.5))); } return base + p; }
function drawWipe(t) {
  for (const w of WIPES) {
    const k = (t - w) / 0.34 + 0.5; if (k < 0 || k > 1) continue;
    const x = lerp(-2300, 1500, k);
    const gr = ctx.createLinearGradient(x, 0, x + 2200, 0); gr.addColorStop(0, 'rgba(255,176,0,0)'); gr.addColorStop(0.15, 'rgba(217,48,44,1)'); gr.addColorStop(0.5, 'rgba(255,194,51,1)'); gr.addColorStop(0.85, 'rgba(217,48,44,1)'); gr.addColorStop(1, 'rgba(255,176,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x + 400, 0); ctx.lineTo(x + 2200, 0); ctx.lineTo(x + 1800, H); ctx.lineTo(x, H); ctx.fill();
  }
}

// ---------- main ----------
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const z = zoomAt(t), sh = shake(t) * 14;
  ctx.translate(W / 2 + Math.sin(t * 73) * sh, H * 0.62 + Math.cos(t * 61) * sh); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.62);
  drawShot(t);
  ctx.restore();
  const tg = ctx.createLinearGradient(0, 0, 0, 1000); tg.addColorStop(0, 'rgba(0,0,0,0.5)'); tg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 1000);
  const vg = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // Spannung
  const tense = Math.max(inv(B[3], B[3] + 0.3, t) * (1 - inv(ARENA - 0.1, ARENA, t)), inv(FOE, FOE + 0.3, t) * (1 - inv(B[4] - 0.1, B[4], t)), inv(FALL, FALL + 0.2, t) * (1 - inv(ALIVE - 0.05, ALIVE + 0.2, t)));
  if (tense > 0) {
    const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 1.4)), 6);
    const rv = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); rv.addColorStop(0, 'rgba(160,0,0,0)'); rv.addColorStop(1, `rgba(170,0,0,${tense * (0.35 + 0.35 * beat)})`); ctx.fillStyle = rv; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 150 * tense); ctx.fillRect(0, H - 170 * tense, W, 170 * tense);
  }
  // Hook: schwarzer Start, Schwerthieb schneidet das Bild auf
  if (t < 1.1) {
    const op = ease(inv(0.62, 1.0, t));
    ctx.fillStyle = '#000';
    ctx.save(); ctx.translate(-op * 500, -op * 700); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 760); ctx.lineTo(0, 1260); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(op * 500, op * 700); ctx.beginPath(); ctx.moveTo(0, 1260); ctx.lineTo(W, 760); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill(); ctx.restore();
    const sl = clamp((t - 0.45) / 0.17);
    if (sl > 0 && t < 0.85) { ctx.strokeStyle = `rgba(255,250,230,${1 - inv(0.62, 0.85, t)})`; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(0, 1260); ctx.lineTo(W * sl, 1260 - 500 * sl); ctx.stroke(); }
  }
  drawHook(t); drawTimeline(t);
  for (const sc of SCENES) drawSceneText(t, sc);
  drawOutro(t);
  drawWipe(t);
  const fl = flash(t); if (fl > 0) { ctx.fillStyle = `rgba(255,245,220,${fl * 0.9})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = 'rgba(255,255,255,0.025)'; for (let y = (t * 300) % 6; y < H; y += 6) ctx.fillRect(0, y, W, 1);
}
window.renderFrame = renderFrame;
if (!location.hash.includes('render')) { const st = performance.now(); (function loop() { renderFrame(((performance.now() - st) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); }
document.fonts.load(`900 100px Inter`).then(() => { window.READY = true; });
</script>
