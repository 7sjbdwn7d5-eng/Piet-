<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Die Mikrowelle</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton-latin-400-normal.woff2') format('woff2'); }
  html,body{margin:0;background:#000} canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  Story-Format: "Die Mikrowelle – erfunden durch einen geschmolzenen Schokoriegel"
//  Flache Vektor-Illustration, Figuren mit Mimik, Kamera-Moves,
//  unscharfe Hintergründe, 2–3-Wort-Untertitel, REAL-Fakten-Schild.
// ============================================================
const W = 1080, H = 1920;
let ctx = document.getElementById('c').getContext('2d');
const MAIN = ctx;
const OFF = {};
const CAP = '"Anton", "Inter", sans-serif', UI = '"Inter", sans-serif';

// ---- Zeitplan (Video-Sekunden) – auf den Sprecher gelegt ----
const T = {
  lab: 0, spencer: 1.8, radar: 4.35, magnetron: 6.8, pocket: 8.65, choc: 10.6, corn: 12.85, popcorn: 14.8,
  egg: 16.75, lean: 17.55, splat: 18.9, patent: 21.75, school: 23.6, radarange: 26.9, end: 31.35, out: 37.0,
};
window.DURATION = T.out;
const SHOTS = Object.keys(T).filter(k => k !== 'out');
const REAL = [
  [0.4, T.spencer, 'Eine wahre Erfindungsgeschichte'],
  [T.spencer + 0.4, T.magnetron, 'Percy Spencer, Ingenieur bei Raytheon'],
  [T.magnetron + 0.2, T.choc, 'Magnetrons erzeugten Mikrowellen fürs Radar'],
  [T.choc + 0.2, T.corn, 'Um 1945: Ein Riegel schmolz in seiner Tasche'],
  [T.corn + 0.2, T.egg, 'Popcorn war einer seiner ersten Tests'],
  [T.patent + 0.2, T.school, '1945 meldete er das Patent an'],
  [T.school + 0.2, T.radarange, 'Spencer verließ die Schule mit etwa 12 Jahren'],
  [T.radarange + 0.2, T.end, '1947: „Radarange“ – ca. 1,8 m hoch, ca. 340 kg'],
];
// Untertitel: wird von captions.json ersetzt, falls vorhanden (window.CAPTIONS)
let CAPTIONS = window.CAPTIONS || [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, k) { const A = hex(a), B2 = hex(b); return `rgb(${lerp(A[0], B2[0], k) | 0},${lerp(A[1], B2[1], k) | 0},${lerp(A[2], B2[2], k) | 0})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(1979); const rr = (a, b) => lerp(a, b, R());
function shotOf(t) { let s = SHOTS[0]; for (const k of SHOTS) if (t >= T[k]) s = k; return s; }
function nextT(k) { const i = SHOTS.indexOf(k); return i < SHOTS.length - 1 ? T[SHOTS[i + 1]] : T.out; }
// Schnelle Unschärfe: Ebene in kleiner Auflösung zeichnen und hochskaliert einblenden (statt teurem ctx.filter)
function layer(factor, fn, filter = 'none') {
  const key = factor; if (!OFF[key]) { const c = document.createElement('canvas'); c.width = Math.ceil(W / factor); c.height = Math.ceil(H / factor); OFF[key] = c; }
  const oc = OFF[key], o = oc.getContext('2d'), main = ctx, m = main.getTransform();
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height);
  o.setTransform(m.a / factor, m.b / factor, m.c / factor, m.d / factor, m.e / factor, m.f / factor);
  ctx = o; try { fn(); } finally { ctx = main; }
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.imageSmoothingEnabled = true; main.imageSmoothingQuality = 'high'; main.filter = filter; main.drawImage(oc, 0, 0, W, H); main.restore();
}
function blurred(px, fn) { layer(px >= 10 ? 7 : 5, fn); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

// ============================================================
//  FIGUREN (flacher Stil, große Augen, Mimik)
// ============================================================
// mood: 'calm' | 'happy' | 'worried' | 'shock' | 'sad'
function face(x, y, r, mood, look = [0, 0], o = {}) {
  const eyeR = r * 0.2, ex = r * 0.36, ey = -r * 0.05;
  for (const s of [-1, 1]) {
    const open = mood === 'shock' ? 1.25 : 1;
    ell(x + s * ex, y + ey, eyeR * open, eyeR * 1.15 * open, '#ffffff');
    circ(x + s * ex + look[0] * eyeR * 0.45, y + ey + look[1] * eyeR * 0.45, eyeR * (mood === 'shock' ? 0.45 : 0.6), '#231a17');
    circ(x + s * ex + look[0] * eyeR * 0.45 - eyeR * 0.18, y + ey + look[1] * eyeR * 0.45 - eyeR * 0.2, eyeR * 0.16, '#fff');
    // Augenbrauen: innen höher = besorgt/traurig, innen tiefer = wütend
    ctx.strokeStyle = o.brow || '#3a2418'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round'; ctx.beginPath();
    const by = y + ey - eyeR * 1.55 - (mood === 'shock' ? eyeR * 0.5 : 0) - (mood === 'happy' ? eyeR * 0.15 : 0);
    const innerUp = mood === 'worried' || mood === 'sad' ? eyeR * 0.55 : mood === 'angry' ? -eyeR * 0.5 : 0;
    ctx.moveTo(x + s * (ex - eyeR * 0.9), by - innerUp); ctx.lineTo(x + s * (ex + eyeR), by + innerUp * 0.3);
    ctx.stroke();
  }
  // Mund
  ctx.strokeStyle = '#3a1f17'; ctx.lineWidth = r * 0.07; ctx.beginPath();
  const my = y + r * 0.45;
  if (mood === 'happy') ctx.arc(x, my - r * 0.12, r * 0.22, 0.2, Math.PI - 0.2);
  else if (mood === 'shock') { ctx.stroke(); ell(x, my, r * 0.12, r * 0.16, '#3a1f17'); return; }
  else if (mood === 'worried' || mood === 'sad') ctx.arc(x, my + r * 0.14, r * 0.18, Math.PI + 0.4, -0.4);
  else { ctx.moveTo(x - r * 0.14, my); ctx.lineTo(x + r * 0.14, my); }
  ctx.stroke();
}
function sweat(x, y, s, t) { const k = (t * 1.2) % 1; ctx.save(); ctx.globalAlpha = 1 - k * 0.6; ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(x, y + k * 20 * s - 18 * s); ctx.quadraticCurveTo(x + 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s + 10 * s); ctx.quadraticCurveTo(x - 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s - 18 * s); ctx.fill(); ctx.restore(); }
// Person (Ganzkörper). opts: skin, tunic, hair, mood, look, arms:[l,r] Winkel, walk, carry
function person(x, y, s, o = {}) {
  const skin = o.skin || '#e0a57a', tunic = o.tunic || '#c9583a', hair = o.hair || '#3a2418';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const w = o.walk || 0, lg = Math.sin(w) * 18;
  // Beine
  ctx.strokeStyle = skin; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -110); ctx.lineTo(-20 - lg, -8); ctx.moveTo(16, -110); ctx.lineTo(20 + lg, -8); ctx.stroke();
  ell(-22 - lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126'); ell(22 + lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126');
  if (o.coat) { poly([[-50, -275], [50, -275], [70, -60], [-70, -60]], o.coat); rect(-4, -270, 8, 200, 'rgba(0,0,0,0.25)'); }
  else if (o.modern) { ctx.strokeStyle = o.pants || '#3a4a6a'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(-16, -150); ctx.lineTo(-20 - lg, -12); ctx.moveTo(16, -150); ctx.lineTo(20 + lg, -12); ctx.stroke(); rrect(-48, -275, 96, 140, 22, tunic); poly([[-18, -275], [0, -250], [18, -275]], 'rgba(255,255,255,0.7)'); }
  else { poly([[-46, -270], [46, -270], [62, -105], [-62, -105]], tunic); rect(-50, -200, 100, 12, 'rgba(0,0,0,0.15)'); }
  // Arme
  const [al, ar] = o.arms || [0.15, -0.15];
  ctx.strokeStyle = skin; ctx.lineWidth = 20;
  for (const [sx, v] of [[-1, al], [1, ar]]) { const a = Math.abs(v); ctx.beginPath(); ctx.moveTo(sx * 40, -255); ctx.lineTo(sx * 40 + sx * Math.sin(a) * 105, -255 + Math.cos(a) * 105); ctx.stroke(); }
  // Kopf
  circ(0, -330, 62, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -342, 64, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(40, -360, 0, -362); ctx.fill();
  if (o.beard) { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -318, 58, 0.15, Math.PI - 0.15); ctx.fill(); circ(0, -318, 40, skin); }
  face(0, -326, 62, o.mood || 'calm', o.look || [0, 0], { brow: hair });
  if (o.sweat) sweat(56, -380, 1.2, o.t || 0);
  if (o.hat) { rrect(-70, -392, 140, 22, 10, o.hat); rrect(-48, -440, 96, 56, 14, o.hat); }
  if (o.pillow) { rrect(-80, -440, 160, 56, 26, '#e9d8b8'); rect(-80, -414, 160, 6, '#c9b590'); }
  ctx.restore();
}
function sky(top, bot, y1 = 1300) { const g = ctx.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, y1 + 400); }
const stars = Array.from({ length: 200 }, () => ({ x: rr(-100, W + 100), y: rr(-200, 1200), r: rr(0.8, 2.6), b: rr(0.3, 1) }));
function starfield(t, a = 1) { for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${a * s.b * (0.7 + 0.3 * Math.sin(t * 2 + s.x))})`; ctx.fillRect(s.x, s.y, s.r, s.r); } }
function pine(x, y, s, c = '#1a2a24') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(-8, -40, 16, 40, '#2a1e16'); for (let i = 0; i < 4; i++) poly([[-90 + i * 15, -40 - i * 70], [0, -160 - i * 70], [90 - i * 15, -40 - i * 70]], c); ctx.restore(); }
function forestRow(base, n, s, c, seed = 1) { const r2 = rng(seed); for (let i = 0; i < n; i++) pine(-60 + i * (1200 / n) + r2() * 40, base + r2() * 30, s * (0.8 + r2() * 0.4), c); }
const SH = {};
function camera(scale, x = 0, y = 0) { ctx.translate(W / 2 + x, H / 2 + y); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2); }




// ============================================================
//  MIKROWELLE – Kulissen & Figuren (USA 1945)
// ============================================================
const SPENCER = { skin: '#f0c4a0', hair: '#9a9a96', shirt: '#4a5060', glasses: true, tie: '#8a2a2a' };
const EDDIE = { skin: '#f2c8a4', hair: '#8a4a1e', shirt: '#f4f4f0', glasses: false, coat: true };
function bustP(x, y, r, o = {}) {
  const skin = o.skin, hair = o.hair;
  rrect(x - r * 1.1, y + r * 0.85, r * 2.2, r * 3.4, r * 0.5, o.shirt);
  if (o.coat) { poly([[x - r * 0.4, y + r * 0.85], [x, y + r * 1.7], [x + r * 0.4, y + r * 0.85]], '#c8d8e8'); ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = r * 0.04; ctx.beginPath(); ctx.moveTo(x, y + r * 1.7); ctx.lineTo(x, y + r * 4); ctx.stroke(); rect(x + r * 0.4, y + r * 1.9, r * 0.4, r * 0.06, '#3a6ab0'); }
  if (o.tie) { poly([[x - r * 0.35, y + r * 0.85], [x, y + r * 1.25], [x + r * 0.35, y + r * 0.85]], '#f4f4f0'); poly([[x - r * 0.1, y + r * 1.0], [x + r * 0.1, y + r * 1.0], [x + r * 0.16, y + r * 2.0], [x, y + r * 2.2], [x - r * 0.16, y + r * 2.0]], o.tie); }
  circ(x, y, r, skin); circ(x - r, y + r * 0.05, r * 0.2, skin); circ(x + r, y + r * 0.05, r * 0.2, skin);
  ctx.fillStyle = hair;
  if (o.receding) { ctx.beginPath(); ctx.arc(x - r * 0.78, y - r * 0.3, r * 0.32, 0, 7); ctx.arc(x + r * 0.78, y - r * 0.3, r * 0.32, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(x, y - r * 0.2, r * 1.0, Math.PI * 1.25, Math.PI * 1.75); ctx.lineTo(x, y - r * 0.7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x, y - r * 0.18, r * 1.03, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(x + r * 0.5, y - r * 0.4, x - r * 0.2, y - r * 0.7); ctx.quadraticCurveTo(x - r * 0.7, y - r * 0.45, x - r * 1.0, y - r * 0.25); ctx.fill(); }
  face(x, y + r * 0.05, r, o.mood || 'calm', o.look || [0, 0], { brow: o.brow || '#5a4a3a' });
  if (o.glasses) { ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = r * 0.05; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.36, y, r * 0.27, 0, 7); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(x - r * 0.09, y); ctx.lineTo(x + r * 0.09, y); ctx.stroke(); }
  if (o.egg) { const k = o.egg; ctx.save(); ctx.globalAlpha = 0.95; ell(x + r * 0.1, y + r * 0.1, r * 0.75 * k, r * 0.6 * k, '#fff8e8'); ell(x + r * 0.15, y + r * 0.15, r * 0.35 * k, r * 0.3 * k, '#ffc21a'); for (let i = 0; i < 5; i++) ell(x - r * 0.5 + i * r * 0.3, y + r * (0.6 + (i % 2) * 0.3) * k, r * 0.08, r * 0.2 * k, '#fff8e8'); ctx.restore(); }
}
function sperson(x, y, s, o = {}) { const c = o.who === 'eddie' ? EDDIE : SPENCER; person(x, y, s, o.who === 'eddie' ? { coat: '#f4f4f0', skin: c.skin, hair: c.hair, mood: o.mood, look: o.look, arms: o.arms, walk: o.walk, t: o.t } : { modern: true, tunic: c.shirt, pants: '#3a3e48', skin: c.skin, hair: c.hair, mood: o.mood, look: o.look, arms: o.arms, walk: o.walk, t: o.t });
  if (o.who !== 'eddie') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); poly([[-8, -270], [8, -270], [12, -190], [0, -178], [-12, -190]], c.tie); ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 4; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 22, -330, 16, 0, 7); ctx.stroke(); } ctx.restore(); } }
function lab(t, o = {}) {
  rect(-200, -200, W + 400, H + 400, '#c8ccc0'); for (let x = -200; x < W + 200; x += 140) rect(x, -200, 6, 1700, 'rgba(0,0,0,0.06)');
  rect(-200, 1500, W + 400, 700, '#5a5a52'); for (let x = -200; x < W + 200; x += 120) rect(x, 1500, 4, 700, 'rgba(0,0,0,0.15)');
  rrect(300, 870, 480, 90, 12, '#2a3a5a'); ctx.font = `56px ${CAP}`; ctx.fillStyle = '#f2ead8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RAYTHEON · LABOR', 540, 916);
  for (let i = 0; i < 4; i++) { const x = 80 + i * 250; rrect(x, 520, 200, 280, 10, '#6a7a6a'); for (let k = 0; k < 3; k++) { circ(x + 50 + k * 50, 600, 18, '#2a2a2a'); circ(x + 50 + k * 50, 600, 10, ['#e8c040', '#3ddc84', '#ff6040'][k]); } rect(x + 30, 680, 140, 80, '#1a2a1a'); ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = 3; ctx.beginPath(); for (let px = 0; px < 140; px += 4) ctx.lineTo(x + 30 + px, 720 + Math.sin(px * 0.15 + t * 6 + i) * 20); ctx.stroke(); }
  rect(60, 1250, 960, 40, '#7a5a3a'); rect(90, 1290, 30, 260, '#5a3a22'); rect(960, 1290, 30, 260, '#5a3a22');
}
function magnetron(x, y, s, t, on = true) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rrect(-120, -160, 240, 320, 20, '#8a8a90'); for (let i = 0; i < 6; i++) rect(-150, -130 + i * 50, 300, 16, '#6a6a70'); circ(0, 0, 70, '#b06a3a'); circ(0, 0, 40, '#5a3a22'); rect(-20, -230, 40, 80, '#5a5a60');
  ctx.restore();
  if (on) for (let i = 0; i < 4; i++) { const k = (t * 1.2 + i / 4) % 1; ctx.strokeStyle = `rgba(255,180,60,${0.7 * (1 - k)})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x + 150 * s, y, 60 + k * 400 * s, -0.5, 0.5); ctx.stroke(); }
}
function chocBar(x, y, s, melt, t) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rrect(-200, -60, 400, 120, 10, '#c8302a'); ctx.font = `60px ${CAP}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SCHOKO', 0, 2);
  ctx.fillStyle = '#5a2e14'; for (let i = 0; i < 6; i++) { const len = melt * (60 + (i * 47) % 120) + Math.sin(t * 2 + i) * 4 * melt; rect(-170 + i * 66, 50, 30, len); circ(-155 + i * 66, 50 + len, 18 * Math.min(1, melt * 2), '#5a2e14'); }
  ell(0, 58, 210, 22 * Math.min(1, melt * 3), '#5a2e14'); ctx.restore(); }
function popcorn(x, y, r) { ctx.fillStyle = '#fff6d8'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 1.3) * r * 0.5, y + Math.sin(k * 1.3) * r * 0.5, r * 0.55, 0, 7); ctx.fill(); } circ(x, y + r * 0.3, r * 0.3, '#f0c060'); }
const corns = Array.from({ length: 40 }, () => ({ x: rr(-200, 200), vx: rr(-700, 700), vy: rr(-1600, -700), t0: rr(0, 0.8), r: rr(18, 32), rot: rr(0, 6) }));

// ---------- Einstellungen ----------
SH.lab = (t, lt, len) => { ctx.save(); camera(1.08 - 0.06 * ease(lt / len));
  lab(t); magnetron(540, 1130, 0.5, t, false); sperson(280, 1940, 1.6, { who: 'eddie', look: [1, 0], mood: 'happy', arms: [0.3, 1.2] }); sperson(800, 1940, 1.65, { look: [-1, 0], arms: [1.1, 0.3] });
  ctx.restore();
  const k = backOut(clamp(lt / 0.35)) * (1 - clamp((lt - 1.4) / 0.25)); if (k > 0.01) { ctx.save(); ctx.translate(540, 900); ctx.scale(k, k); capText([['USA 1945', '#ffb020']], 0, 0, 170); ctx.restore(); }
  const k2 = backOut(clamp((lt - 0.5) / 0.3)); if (k2 > 0) { ctx.save(); ctx.translate(280, 1300); ctx.scale(k2, k2); rrect(-100, -44, 200, 88, 44, '#ffb020'); ctx.fillStyle = '#111'; ctx.font = `56px ${CAP}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EDDIE', 0, 4); ctx.restore(); } };
SH.spencer = (t, lt, len) => { ctx.save(); camera(1.08 + 0.06 * ease(lt / len));
  blurred(10, () => lab(t)); bustP(540, 900, 230, { ...SPENCER, receding: true, mood: 'happy', look: [0.4, -0.1] });
  ctx.restore();
  const k = backOut(clamp((lt - 0.3) / 0.3)); if (k > 0) { ctx.save(); ctx.translate(540, 470); ctx.scale(k, k); capText([['PERCY SPENCER', '#ffb020']], 0, 0, 100); ctx.restore(); } };
SH.radar = (t, lt, len) => { ctx.save(); camera(1.05 + 0.05 * ease(lt / len));
  sky('#5a7aa8', '#c8d8e8', 1300); rect(-300, 1300, W + 600, 900, '#3a5a7a'); for (let i = 0; i < 14; i++) rect(-300 + ((i * 140 + lt * 50) % 1700), 1340 + (i % 4) * 60, 80, 6, 'rgba(255,255,255,0.35)');
  poly([[0, 1450], [1080, 1450], [980, 1650], [100, 1650]], '#5a6068'); rect(380, 1050, 320, 400, '#6a7078'); rect(510, 760, 60, 300, '#5a6068');
  ctx.save(); ctx.translate(540, 760); ctx.scale(Math.cos(t * 2.5), 1); rrect(-220, -90, 440, 70, 12, '#8a9098'); for (let i = -200; i <= 200; i += 40) rect(i - 3, -90, 6, 70, '#5a6068'); ctx.restore();
  for (let i = 0; i < 3; i++) { const k = (t * 0.8 + i / 3) % 1; ctx.strokeStyle = `rgba(160,220,255,${0.6 * (1 - k)})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(540, 730, 100 + k * 600, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  ctx.restore();

SH.patent = (t, lt, len) => { ctx.save(); camera(1.0 + 0.08 * ease(lt / len));
  rect(-200, -200, W + 400, H + 400, '#1a2a4a'); ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; for (let x = -200; x < W + 200; x += 60) { ctx.beginPath(); ctx.moveTo(x, -200); ctx.lineTo(x, H + 200); ctx.stroke(); }

// ============================================================

function capText(lines, x, y, size, stacked = false) {

function drawCaption(t) {

function renderFrame(t) {
