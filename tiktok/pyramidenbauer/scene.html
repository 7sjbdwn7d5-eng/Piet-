<!doctype html>
<html lang="de">
<head>

<title>Ein Tag als Pyramidenbauer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  "Ein Tag als Pyramidenbauer"  – Format: Ein Tag als …
//  renderFrame(t) zeichnet das Bild zur Video-Zeit t (Sekunden).
// ============================================================
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const FONT = '"Inter", "Inter Display", sans-serif';

// Szenen-Schnitte (Video-Zeit), getimt auf den Sprechertext (lines.json)
const B = [0, 4.1, 12.11, 19.35, 26.19, 32.36, 37.47];   // getimt auf Brian (sprecher_brian.mp3)
const S = { hook: [B[0], B[1]], s5: [B[1], B[2]], s8: [B[2], B[3]], s12: [B[3], B[4]], s17: [B[4], B[5]], outro: [B[5], B[6]] };
// Einstellungen innerhalb der Szenen
const AGO = 2.12;                    // "Vor viereinhalbtausend Jahren"
const NOSLAVE = 6.72, TEAMS = 9.44; // "Keine Sklaven" / "in Teams wie: Freunde des Cheops"
const CARS = 14.85;                 // "so schwer wie zwei Autos"
const SLED = 15.97, WATER = 16.68, GLIDE = 17.93;   // "Der Trick" / "Wasser auf den Sand" / "dann gleitet der Schlitten"
const BREAD = 20.36, ONION = 21.02, BEER = 21.77;   // Brot, Zwiebeln, Bier
const LITER = 22.37, WAGE = 25.11;    // "Mehrere Liter am Tag" / "Teil des Lohns"
const TOMB = 29.41;                 // "Und wer starb, bekam ein Grab neben der Pyramide"
const WIPES = [NOSLAVE, TEAMS, SLED, LITER, WAGE, TOMB];
window.DURATION = B[6];

const SCENES = [
  { key: 's5', pre: '', big: '05:00 UHR', node: '05:00', place: 'ARBEITERDORF GIZEH',
    facts: [{ at: 0.8, text: 'Aufstehen im *Arbeiterdorf*.' }, { at: NOSLAVE - B[1] + 0.1, text: '*Keine Sklaven* – sondern bezahlte Arbeiter.' }, { at: TEAMS - B[1] + 0.1, text: 'Teams mit Namen wie *„Freunde des Cheops"*.' }] },
  { key: 's8', pre: '', big: '08:00 UHR', node: '08:00', place: 'BAUSTELLE',
    facts: [{ at: 1.0, text: 'Ein Steinblock: so schwer wie *zwei Autos*.' }, { at: SLED - B[2] + 0.1, text: 'Der Trick: *Wasser* auf den Sand.' }] },
  { key: 's12', pre: '', big: '12:00 UHR', node: '12:00', place: 'MITTAGSPAUSE',
    facts: [{ at: 1.0, text: '*Brot, Zwiebeln* und Bier.' }, { at: LITER - B[3] + 0.1, text: '*Mehrere Liter* Bier am Tag – dick wie Brei.' }, { at: WAGE - B[3] + 0.1, text: 'Das Bier war *Teil des Lohns*.' }] },
  { key: 's17', pre: '', big: '17:00 UHR', node: '17:00', place: 'FEIERABEND',
    facts: [{ at: 0.9, text: 'Verletzte wurden von *Ärzten* versorgt.' }, { at: TOMB - B[4] + 0.1, text: 'Wer starb, bekam ein *Grab* neben der Pyramide.' }] },
];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, k) { return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)]; }
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(2560); const rr = (a, b) => lerp(a, b, R());
const GOLD = '#ffc233', RED = '#d9302c', LAPIS = '#1f5fbf', SANDC = '#e6c48a';

// ============================================================
//  FIGUREN
// ============================================================
const SKIN = '#9a5f36', SKIN_D = '#7a4526', KILT = '#f4efe2';
function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
// type: 'worker' | 'doctor' | 'scribe'; lean = Vorbeugen beim Ziehen
function person(x, y, s, o = {}) {
  const type = o.type || 'worker', f = o.face || 1, walk = o.walk || 0, lean = o.lean || 0, armA = o.arm ?? 0.4;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  const lg = Math.sin(walk) * 16;
  limb(-12, -95, -18 - lg, 0, 20, SKIN); limb(12, -95, 18 + lg, 0, 20, SKIN);
  ctx.save(); ctx.rotate(lean);
  ctx.fillStyle = type === 'doctor' || type === 'scribe' ? '#ffffff' : KILT;
  if (type === 'worker') { ctx.beginPath(); ctx.moveTo(-32, -125); ctx.lineTo(32, -125); ctx.lineTo(38, -80); ctx.lineTo(-38, -80); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(-34, -230); ctx.lineTo(34, -230); ctx.lineTo(42, -60); ctx.lineTo(-42, -60); ctx.fill(); }
  if (type === 'worker') { ctx.fillStyle = SKIN; ctx.beginPath(); ctx.roundRect(-34, -228, 68, 108, 20); ctx.fill(); ctx.strokeStyle = SKIN_D; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -212); ctx.lineTo(0, -150); ctx.stroke(); }
  // Arme
  const hx = 30 + Math.cos(-armA) * 72, hy = -205 + Math.sin(armA) * 72;
  limb(28, -208, hx, hy, 18, SKIN); limb(-28, -208, -30 + Math.cos(Math.PI - armA * 0.8) * 60, -200 + Math.sin(armA * 0.8 + 0.6) * 60, 18, SKIN);
  if (o.hold === 'jar') { ctx.save(); ctx.translate(hx, hy); ctx.rotate(o.tilt || 0); ctx.fillStyle = '#b5653a'; ctx.beginPath(); ctx.ellipse(20, 0, 26, 34, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#8a4a26'; ctx.fillRect(36, -12, 18, 24); ctx.restore(); }
  if (o.hold === 'papyrus') { ctx.fillStyle = '#f1e2b0'; ctx.fillRect(hx - 10, hy - 20, 80, 52); ctx.strokeStyle = '#6a4a20'; ctx.lineWidth = 2; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(hx - 2, hy - 10 + i * 11); ctx.lineTo(hx + 60, hy - 10 + i * 11); ctx.stroke(); } }
  // Kopf
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(0, -258, 28, 0, 7); ctx.fill();
  if (type === 'worker') { ctx.fillStyle = '#e9e2cf'; ctx.beginPath(); ctx.arc(0, -264, 30, Math.PI, 0); ctx.fill(); }
  else if (type === 'scribe') { ctx.fillStyle = '#1a1410'; ctx.beginPath(); ctx.arc(0, -264, 30, Math.PI * 1.0, Math.PI * 2); ctx.lineTo(30, -236); ctx.lineTo(-30, -236); ctx.fill(); }
  ctx.fillStyle = '#140c08'; ctx.beginPath(); ctx.arc(10, -258, 4, 0, 7); ctx.fill();
  ctx.restore(); ctx.restore();
}

// ============================================================
//  SHOTS
// ============================================================
function easeIn(k) { return k * k * k; }
function skyDesert(top = '#4f9ae0', bot = '#ffe1a8') { const g = ctx.createLinearGradient(0, 0, 0, 1400); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, 1800); }
function pyramid(cx, base, wid, hgt, done = 1, col = '#e0bf86', shade = '#b8935a') {
  const topY = base - hgt * done, half = wid / 2, topHalf = half * (1 - done);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx - half, base); ctx.lineTo(cx - topHalf, topY); ctx.lineTo(cx + topHalf, topY); ctx.lineTo(cx + half, base); ctx.fill();
  ctx.fillStyle = shade; ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx + (done < 1 ? topHalf * 0.3 : 0), topY); ctx.lineTo(cx + topHalf, topY); ctx.lineTo(cx + half, base); ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,0.35)'; ctx.lineWidth = 3; for (let y = base - 30; y > topY; y -= 30) { const w2 = half * (y - (base - hgt)) / hgt; ctx.beginPath(); ctx.moveTo(cx - w2, y); ctx.lineTo(cx + w2, y); ctx.stroke(); }
}
// --- Hook ---
function hookShot(t) {
  skyDesert('#3b7fd0', '#ffd79a');
  const sg = ctx.createRadialGradient(830, 900, 20, 830, 900, 420); sg.addColorStop(0, 'rgba(255,240,180,1)'); sg.addColorStop(1, 'rgba(255,220,140,0)'); ctx.fillStyle = sg; ctx.fillRect(400, 480, 860, 860);
  const z = 1 + 0.35 * ease(inv(0, B[1], t));
  ctx.save(); ctx.translate(W / 2, 1450); ctx.scale(z, z); ctx.translate(-W / 2, -1450);
  pyramid(260, 1400, 520, 330, 1, '#d8b47a', '#b08a52');
  pyramid(660, 1430, 900, 560, 0.62);
  // Rampe
  ctx.fillStyle = '#c9a46a'; ctx.beginPath(); ctx.moveTo(150, 1440); ctx.lineTo(540, 1230); ctx.lineTo(600, 1230); ctx.lineTo(320, 1440); ctx.fill();
  // Nil
  ctx.fillStyle = '#2f7fc8'; ctx.beginPath(); ctx.moveTo(-100, 1520); ctx.quadraticCurveTo(500, 1470, 1200, 1560); ctx.lineTo(1200, 1620); ctx.quadraticCurveTo(500, 1530, -100, 1580); ctx.fill();
  ctx.fillStyle = '#e6c48a'; ctx.fillRect(-300, 1440, W + 600, 80); ctx.fillStyle = '#d9b77a'; ctx.fillRect(-300, 1600, W + 600, 500);
  for (const px of [80, 960, 1040]) { ctx.strokeStyle = '#6a4a20'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(px, 1600); ctx.lineTo(px + 10, 1450); ctx.stroke(); ctx.fillStyle = '#2f8a3a'; for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(px + 10, 1450); ctx.rotate(i * 1.05 + Math.sin(t * 2) * 0.08); ctx.beginPath(); ctx.ellipse(45, 0, 50, 13, 0, 0, 7); ctx.fill(); ctx.restore(); } }
  // winzige Arbeiter auf der Rampe
  for (let i = 0; i < 12; i++) { const k = ((t * 0.08 + i / 12) % 1); ctx.fillStyle = '#4a2a14'; ctx.fillRect(lerp(170, 560, k), lerp(1430, 1235, k) - 14, 6, 14); }
  ctx.restore();
}
// --- Arbeiterdorf bei Sonnenaufgang ---
function villageShot(t) {
  const lt = t - B[1], dawn = ease(clamp(lt / 2.2));
  skyDesert(rgbHex(mix(hex('#2a2f6a'), hex('#5aa0e0'), dawn)), rgbHex(mix(hex('#ff8a50'), hex('#ffe0a8'), dawn)));
  const sy = lerp(1250, 1000, dawn); const sg = ctx.createRadialGradient(780, sy, 20, 780, sy, 380); sg.addColorStop(0, 'rgba(255,220,150,1)'); sg.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = sg; ctx.fillRect(400, sy - 380, 760, 760);
  ctx.fillStyle = '#fff2c0'; ctx.beginPath(); ctx.arc(780, sy, 60, 0, 7); ctx.fill();
  pyramid(780, 1250, 600, 380, 0.62, '#caa874', '#a6844f');
  ctx.fillStyle = '#d9b77a'; ctx.fillRect(0, 1250, W, 700);
  // Lehmhäuser
  const hs = [[40, 1330, 220, 170], [290, 1300, 200, 200], [520, 1340, 240, 160], [800, 1310, 240, 190]];
  for (const [x, y, w, h] of hs) { ctx.fillStyle = '#b98a56'; ctx.fillRect(x, y - h, w, h); ctx.fillStyle = '#9c7040'; ctx.fillRect(x, y - h, w, 16); ctx.fillStyle = '#3a2210'; ctx.fillRect(x + w / 2 - 25, y - 90, 50, 90); ctx.fillRect(x + 20, y - h + 40, 30, 22); }
  // Rauch aus Brotöfen
  for (let i = 0; i < 10; i++) { const k = (lt * 0.4 + i / 10) % 1; ctx.fillStyle = `rgba(240,240,240,${0.35 * (1 - k)})`; ctx.beginPath(); ctx.arc(380 + Math.sin(i + t) * 20, 1090 - k * 300, 20 + k * 40, 0, 7); ctx.fill(); }
  // Arbeiter treten heraus, einer streckt sich
  person(170, 1700, 1.15, { arm: lerp(0.5, -1.4, ease(clamp((lt - 0.4) / 0.8))) });
  for (let i = 0; i < 3; i++) { const k = clamp((lt - 0.6 - i * 0.4) / 1.8); person(lerp(390 + i * 230, 520 + i * 200, k), 1660 + i * 30, 0.9, { walk: lt * 7 + i, face: 1 }); }
}
// --- Keine Sklaven ---
function noSlaveShot(t) {
  const lt = t - NOSLAVE;
  const g = ctx.createRadialGradient(540, 1250, 50, 540, 1250, 1100); g.addColorStop(0, '#3a2a1a'); g.addColorStop(1, '#120a04'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Kette
  ctx.strokeStyle = '#8a8f99'; ctx.lineWidth = 16; for (let i = 0; i < 7; i++) { ctx.save(); ctx.translate(200 + i * 112, 1150); ctx.rotate(i % 2 ? 0 : Math.PI / 2 * 0.0); ctx.beginPath(); ctx.ellipse(0, 0, i % 2 ? 50 : 60, i % 2 ? 30 : 36, 0, 0, 7); ctx.stroke(); ctx.restore(); }
  const xk = backOut(clamp((lt - 0.2) / 0.3));
  if (xk > 0) { ctx.save(); ctx.translate(540, 1150); ctx.scale(xk, xk); ctx.rotate(-0.1); ctx.strokeStyle = RED; ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-330, -220); ctx.lineTo(330, 220); ctx.moveTo(330, -220); ctx.lineTo(-330, 220); ctx.stroke(); ctx.restore(); }
  const sk = backOut(clamp((lt - 0.45) / 0.35));
  if (sk > 0) { ctx.save(); ctx.translate(540, 1480); ctx.rotate(-0.06); ctx.scale(sk, sk); ctx.strokeStyle = RED; ctx.lineWidth = 12; ctx.strokeRect(-380, -80, 760, 160); strokeText('KEINE SKLAVEN', 0, 0, 96, RED, 900, 0); ctx.restore(); }
  // Lohn: Brot + Krug
  const pk = backOut(clamp((lt - 1.4) / 0.4));
  if (pk > 0) { ctx.save(); ctx.translate(540, 1690); ctx.scale(pk, pk); bread(-150, 0, 1); jug(120, -10, 0.9); strokeText('= LOHN', 330, 0, 60, GOLD, 900, 12); ctx.restore(); }
}
function bread(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#c98a3e'; ctx.beginPath(); ctx.ellipse(0, 0, 90, 55, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#8a5a22'; ctx.lineWidth = 6; for (const d of [-40, 0, 40]) { ctx.beginPath(); ctx.moveTo(d - 15, -30); ctx.lineTo(d + 15, 30); ctx.stroke(); } ctx.restore(); }
function jug(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#b5653a'; ctx.beginPath(); ctx.ellipse(0, 10, 70, 90, 0, 0, 7); ctx.fill(); ctx.fillRect(-30, -110, 60, 50); ctx.fillStyle = '#8a4a26'; ctx.fillRect(-36, -118, 72, 16); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.ellipse(-25, 0, 14, 50, 0, 0, 7); ctx.fill(); ctx.restore(); }
function onion(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = '#8e3a7a'; ctx.beginPath(); ctx.arc(0, 0, 55, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(-14, -48); ctx.quadraticCurveTo(0, -100, 14, -48); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 38, -1.2, 1.2); ctx.stroke(); ctx.restore(); }
// --- Teams: Graffiti am Steinblock ---
function teamShot(t) {
  const lt = t - TEAMS;
  skyDesert('#5aa0e0', '#ffe8b8'); ctx.fillStyle = '#d9b77a'; ctx.fillRect(0, 1500, W, 500);
  // Arbeiter-Team im Hintergrund am Seil
  for (let i = 0; i < 7; i++) person(120 + i * 130, 1560, 0.6, { lean: 0.35 + Math.sin(t * 4) * 0.05, arm: -0.3, walk: Math.sin(t * 4 + i) * 0.4 });
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(60, 1470); ctx.lineTo(1040, 1470); ctx.stroke();
  // großer Block mit roter Inschrift
  const z = 1 + 0.06 * ease(clamp(lt / 2));
  ctx.save(); ctx.translate(540, 1180); ctx.scale(z, z);
  ctx.fillStyle = '#e8d6a8'; ctx.fillRect(-420, -230, 840, 380); ctx.fillStyle = '#cdb98a'; ctx.fillRect(-420, 130, 840, 20);
  ctx.strokeStyle = 'rgba(150,120,70,0.4)'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-400 + i * 150, -220); ctx.lineTo(-380 + i * 150, 130); ctx.stroke(); }
  const wk = clamp((lt - 0.2) / 0.9);
  ctx.strokeStyle = '#b3261e'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  const glyphs = [[-300, 0], [-200, 0], [-100, 0], [0, 0], [100, 0], [200, 0], [300, 0]];
  glyphs.forEach(([gx, gy], i) => { if (i / glyphs.length > wk) return; ctx.beginPath();
    if (i % 3 === 0) { ctx.ellipse(gx, gy - 40, 30, 22, 0, 0, 7); ctx.moveTo(gx, gy - 18); ctx.lineTo(gx, gy + 60); }
    else if (i % 3 === 1) { ctx.moveTo(gx - 30, gy - 70); ctx.lineTo(gx + 30, gy - 70); ctx.lineTo(gx, gy + 60); ctx.moveTo(gx - 20, gy); ctx.lineTo(gx + 20, gy); }
    else { ctx.arc(gx, gy - 10, 34, Math.PI, 0); ctx.moveTo(gx - 34, gy - 10); ctx.lineTo(gx - 34, gy + 60); ctx.moveTo(gx + 34, gy - 10); ctx.lineTo(gx + 34, gy + 60); }
    ctx.stroke(); });
  ctx.restore();
  const tk = backOut(clamp((lt - 0.9) / 0.4));
  if (tk > 0) { ctx.save(); ctx.translate(540, 1440); ctx.scale(tk, tk); tagC('„FREUNDE DES CHEOPS"', GOLD, '#3a1a00'); ctx.restore(); }
}
function tagC(txt, bg, fg, size = 56) { ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(txt).width + 80; ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -50, w, 100, 50); ctx.fill(); ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 4); }
// --- Steinblock = 2 Autos ---
function car(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-110, -50, 220, 50, 14); ctx.fill(); ctx.beginPath(); ctx.roundRect(-60, -90, 120, 46, 16); ctx.fill(); ctx.fillStyle = 'rgba(180,220,255,0.9)'; ctx.fillRect(-50, -82, 44, 30); ctx.fillRect(6, -82, 44, 30); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-65, 0, 24, 0, 7); ctx.arc(65, 0, 24, 0, 7); ctx.fill(); ctx.restore(); }
function blockShot(t) {
  const lt = t - B[2];
  skyDesert('#4f9ae0', '#ffe6b0'); ctx.fillStyle = '#d9b77a'; ctx.fillRect(0, 1450, W, 500);
  pyramid(540, 1450, 1300, 520, 0.7, '#e3c48e', '#bf9a62');
  // Waage
  const tilt = 0.06 * Math.sin(lt * 3) * (1 - inv(CARS + 0.3, CARS + 1.2, t));
  ctx.save(); ctx.translate(540, 1250);
  ctx.fillStyle = '#6a4a26'; ctx.fillRect(-14, 0, 28, 330); ctx.beginPath(); ctx.moveTo(-60, 330); ctx.lineTo(60, 330); ctx.lineTo(0, 290); ctx.fill();
  ctx.rotate(tilt); ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-440, -14, 880, 28);
  // Block links
  ctx.fillStyle = '#efe0b8'; ctx.fillRect(-420, -230, 260, 216); ctx.fillStyle = '#cdb98a'; ctx.fillRect(-420, -30, 260, 16);
  // Autos rechts (erscheinen bei "zwei Autos")
  const ck = backOut(clamp((t - CARS) / 0.35)), ck2 = backOut(clamp((t - CARS - 0.25) / 0.35));
  if (ck > 0) { ctx.save(); ctx.translate(290, -14); ctx.scale(ck, ck); car(0, 0, 1, '#d9302c'); ctx.restore(); }
  if (ck2 > 0) { ctx.save(); ctx.translate(290, -114); ctx.scale(ck2, ck2); car(0, 0, 1, '#1f5fbf'); ctx.restore(); }
  ctx.restore();
  const nk = backOut(clamp((lt - 0.9) / 0.35));
  if (nk > 0) { ctx.save(); ctx.translate(250, 1560); ctx.scale(nk, nk); tagC('≈ 2,5 TONNEN', '#efe0b8', '#3a2a10', 50); ctx.restore(); }
  if (ck2 > 0) { ctx.save(); ctx.translate(830, 1560); ctx.scale(ck2, ck2); tagC('2 AUTOS', '#fff', '#111', 50); ctx.restore(); }
}
// --- Schlitten + Wasser ---
function sledShot(t) {
  const lt = t - SLED;
  skyDesert('#4f9ae0', '#ffe6b0');
  const wetK = ease(inv(WATER, WATER + 0.6, t)), glideK = inv(GLIDE, B[3], t);
  const move = lt * 40 + glideK * glideK * 320;
  ctx.save(); ctx.translate(540, 1500); ctx.scale(1.15, 1.15); ctx.translate(-640, -1500);
  ctx.fillStyle = '#d9b77a'; ctx.fillRect(-500, 1500, 2200, 800);
  ctx.save(); ctx.translate(-move * 0.3 % 200, 0); for (let i = 0; i < 12; i++) { ctx.fillStyle = 'rgba(170,130,80,0.35)'; ctx.fillRect(i * 200, 1560 + (i % 3) * 40, 60, 6); } ctx.restore();
  // nasse Spur vor dem Schlitten
  if (wetK > 0) { ctx.fillStyle = `rgba(140,100,60,${0.6 * wetK})`; ctx.fillRect(470, 1490, 330 * wetK, 30); }
  // Schlitten mit Block
  const sx = 250 + glideK * glideK * 120;
  ctx.fillStyle = '#7a5530'; ctx.fillRect(sx - 30, 1470, 360, 26); ctx.beginPath(); ctx.moveTo(sx + 330, 1470); ctx.quadraticCurveTo(sx + 380, 1470, sx + 380, 1430); ctx.lineTo(sx + 360, 1430); ctx.quadraticCurveTo(sx + 360, 1450, sx + 330, 1450); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.025)'; for (let y = (t * 300) % 6; y < H; y += 6) ctx.fillRect(0, y, W, 1);
}
window.renderFrame = renderFrame;
if (!location.hash.includes('render')) { const st = performance.now(); (function loop() { renderFrame(((performance.now() - st) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); }
document.fonts.load(`900 100px Inter`).then(() => { window.READY = true; });
</script>
