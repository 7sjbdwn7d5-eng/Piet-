<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Köpenick Teil 2</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton-latin-400-normal.woff2') format('woff2'); }
  html,body{margin:0;background:#000} canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  Story-Format: "Der Hauptmann von Köpenick – Teil 2: Was er wirklich wollte"
//  Flache Vektor-Illustration, Figuren mit Mimik, Kamera-Moves,
//  unscharfe Hintergründe, 2–3-Wort-Untertitel, REAL-Fakten-Schild.
// ============================================================
const W = 1080, H = 1920;
let ctx = document.getElementById('c').getContext('2d');
const MAIN = ctx;
const OFF = {};
const CAP = '"Anton", "Inter", sans-serif', UI = '"Inter", sans-serif';

// ---- Zeitplan (Video-Sekunden) – auf den Sprecher gelegt ----
const T = {
  news: 0, gone: 0.9, laugh: 3.2, paul: 5.15, think: 6.6, nogold: 8.75, pass: 9.7, job: 10.95, expel: 12.7, noamt: 14.55,
  cal: 16.95, arrest: 17.85, verdict: 18.75, pardon: 21.45, star: 23.05, photos: 24.45, you: 27.3, end: 28.85, out: 34.6,
};
window.DURATION = T.out;
const SHOTS = Object.keys(T).filter(k => k !== 'out');
const REAL = [
  [T.gone + 0.2, T.laugh, 'Voigt tauchte nach dem Coup unter'],
  [T.laugh + 0.2, T.paul, 'Die Welt lachte über die Preußen'],
  [T.think + 0.2, T.job, 'Sein Ziel: ein Pass – ohne Papiere keine Arbeit'],
  [T.expel + 0.2, T.noamt, 'Die Polizei hatte ihn aus Berlin ausgewiesen'],
  [T.noamt + 0.2, T.cal, 'Köpenick hatte gar keine Passbehörde'],
  [T.arrest + 0.1, T.pardon, 'Verhaftet am 26.10.1906 – Urteil: 4 Jahre Haft'],
  [T.pardon + 0.2, T.star, '1908 von Kaiser Wilhelm II. begnadigt'],
  [T.photos + 0.1, T.you, 'Er verkaufte Postkarten mit seinem Bild'],
  [T.end + 0.6, T.out, 'Theaterstück von Carl Zuckmayer, 1931'],
];
// Untertitel: wird von captions.json ersetzt, falls vorhanden (window.CAPTIONS)
let CAPTIONS = window.CAPTIONS || [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, k) { const A = hex(a), B2 = hex(b); return `rgb(${lerp(A[0], B2[0], k) | 0},${lerp(A[1], B2[1], k) | 0},${lerp(A[2], B2[2], k) | 0})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(1979); const rr = (a, b) => lerp(a, b, R());
function shotOf(t) { let s = SHOTS[0]; for (const k of SHOTS) if (t >= T[k]) s = k; return s; }
function nextT(k) { const i = SHOTS.indexOf(k); return i < SHOTS.length - 1 ? T[SHOTS[i + 1]] : T.out; }
// Schnelle Unschärfe: Ebene in kleiner Auflösung zeichnen und hochskaliert einblenden (statt teurem ctx.filter)
function layer(factor, fn, filter = 'none') {
  const key = factor; if (!OFF[key]) { const c = document.createElement('canvas'); c.width = Math.ceil(W / factor); c.height = Math.ceil(H / factor); OFF[key] = c; }
  const oc = OFF[key], o = oc.getContext('2d'), main = ctx, m = main.getTransform();
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height);
  o.setTransform(m.a / factor, m.b / factor, m.c / factor, m.d / factor, m.e / factor, m.f / factor);
  ctx = o; try { fn(); } finally { ctx = main; }
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.imageSmoothingEnabled = true; main.imageSmoothingQuality = 'high'; main.filter = filter; main.drawImage(oc, 0, 0, W, H); main.restore();
}
function blurred(px, fn) { layer(px >= 10 ? 7 : 5, fn); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

// ============================================================
//  FIGUREN (flacher Stil, große Augen, Mimik)
// ============================================================
// mood: 'calm' | 'happy' | 'worried' | 'shock' | 'sad'
function face(x, y, r, mood, look = [0, 0], o = {}) {
  const eyeR = r * 0.2, ex = r * 0.36, ey = -r * 0.05;
  for (const s of [-1, 1]) {
    const open = mood === 'shock' ? 1.25 : 1;
    ell(x + s * ex, y + ey, eyeR * open, eyeR * 1.15 * open, '#ffffff');
    circ(x + s * ex + look[0] * eyeR * 0.45, y + ey + look[1] * eyeR * 0.45, eyeR * (mood === 'shock' ? 0.45 : 0.6), '#231a17');
    circ(x + s * ex + look[0] * eyeR * 0.45 - eyeR * 0.18, y + ey + look[1] * eyeR * 0.45 - eyeR * 0.2, eyeR * 0.16, '#fff');
    // Augenbrauen: innen höher = besorgt/traurig, innen tiefer = wütend
    ctx.strokeStyle = o.brow || '#3a2418'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round'; ctx.beginPath();
    const by = y + ey - eyeR * 1.55 - (mood === 'shock' ? eyeR * 0.5 : 0) - (mood === 'happy' ? eyeR * 0.15 : 0);
    const innerUp = mood === 'worried' || mood === 'sad' ? eyeR * 0.55 : mood === 'angry' ? -eyeR * 0.5 : 0;
    ctx.moveTo(x + s * (ex - eyeR * 0.9), by - innerUp); ctx.lineTo(x + s * (ex + eyeR), by + innerUp * 0.3);
    ctx.stroke();
  }
  // Mund
  ctx.strokeStyle = '#3a1f17'; ctx.lineWidth = r * 0.07; ctx.beginPath();
  const my = y + r * 0.45;
  if (mood === 'happy') ctx.arc(x, my - r * 0.12, r * 0.22, 0.2, Math.PI - 0.2);
  else if (mood === 'shock') { ctx.stroke(); ell(x, my, r * 0.12, r * 0.16, '#3a1f17'); return; }
  else if (mood === 'worried' || mood === 'sad') ctx.arc(x, my + r * 0.14, r * 0.18, Math.PI + 0.4, -0.4);
  else { ctx.moveTo(x - r * 0.14, my); ctx.lineTo(x + r * 0.14, my); }
  ctx.stroke();
}
function sweat(x, y, s, t) { const k = (t * 1.2) % 1; ctx.save(); ctx.globalAlpha = 1 - k * 0.6; ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(x, y + k * 20 * s - 18 * s); ctx.quadraticCurveTo(x + 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s + 10 * s); ctx.quadraticCurveTo(x - 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s - 18 * s); ctx.fill(); ctx.restore(); }
// Person (Ganzkörper). opts: skin, tunic, hair, mood, look, arms:[l,r] Winkel, walk, carry
function person(x, y, s, o = {}) {
  const skin = o.skin || '#e0a57a', tunic = o.tunic || '#c9583a', hair = o.hair || '#3a2418';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const w = o.walk || 0, lg = Math.sin(w) * 18;
  // Beine
  ctx.strokeStyle = skin; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -110); ctx.lineTo(-20 - lg, -8); ctx.moveTo(16, -110); ctx.lineTo(20 + lg, -8); ctx.stroke();
  ell(-22 - lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126'); ell(22 + lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126');
  if (o.coat) { poly([[-50, -275], [50, -275], [70, -60], [-70, -60]], o.coat); rect(-4, -270, 8, 200, 'rgba(0,0,0,0.25)'); }
  else if (o.modern) { ctx.strokeStyle = o.pants || '#3a4a6a'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(-16, -150); ctx.lineTo(-20 - lg, -12); ctx.moveTo(16, -150); ctx.lineTo(20 + lg, -12); ctx.stroke(); rrect(-48, -275, 96, 140, 22, tunic); poly([[-18, -275], [0, -250], [18, -275]], 'rgba(255,255,255,0.7)'); }
  else { poly([[-46, -270], [46, -270], [62, -105], [-62, -105]], tunic); rect(-50, -200, 100, 12, 'rgba(0,0,0,0.15)'); }
  // Arme
  const [al, ar] = o.arms || [0.15, -0.15];
  ctx.strokeStyle = skin; ctx.lineWidth = 20;
  for (const [sx, v] of [[-1, al], [1, ar]]) { const a = Math.abs(v); ctx.beginPath(); ctx.moveTo(sx * 40, -255); ctx.lineTo(sx * 40 + sx * Math.sin(a) * 105, -255 + Math.cos(a) * 105); ctx.stroke(); }
  // Kopf
  circ(0, -330, 62, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -342, 64, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(40, -360, 0, -362); ctx.fill();
  if (o.beard) { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -318, 58, 0.15, Math.PI - 0.15); ctx.fill(); circ(0, -318, 40, skin); }
  face(0, -326, 62, o.mood || 'calm', o.look || [0, 0], { brow: hair });
  if (o.sweat) sweat(56, -380, 1.2, o.t || 0);
  if (o.hat) { rrect(-70, -392, 140, 22, 10, o.hat); rrect(-48, -440, 96, 56, 14, o.hat); }
  if (o.pillow) { rrect(-80, -440, 160, 56, 26, '#e9d8b8'); rect(-80, -414, 160, 6, '#c9b590'); }
  ctx.restore();
}
function sky(top, bot, y1 = 1300) { const g = ctx.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, y1 + 400); }
const stars = Array.from({ length: 200 }, () => ({ x: rr(-100, W + 100), y: rr(-200, 1200), r: rr(0.8, 2.6), b: rr(0.3, 1) }));
function starfield(t, a = 1) { for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${a * s.b * (0.7 + 0.3 * Math.sin(t * 2 + s.x))})`; ctx.fillRect(s.x, s.y, s.r, s.r); } }
function pine(x, y, s, c = '#1a2a24') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(-8, -40, 16, 40, '#2a1e16'); for (let i = 0; i < 4; i++) poly([[-90 + i * 15, -40 - i * 70], [0, -160 - i * 70], [90 - i * 15, -40 - i * 70]], c); ctx.restore(); }
function forestRow(base, n, s, c, seed = 1) { const r2 = rng(seed); for (let i = 0; i < n; i++) pine(-60 + i * (1200 / n) + r2() * 40, base + r2() * 30, s * (0.8 + r2() * 0.4), c); }
const SH = {};
function camera(scale, x = 0, y = 0) { ctx.translate(W / 2 + x, H / 2 + y); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2); }

// ---------- Kaiserzeit-Kostüme ----------
const BLUE = '#26355e', RED = '#b3261e', GOLD = '#d8b04a';
function helmet(x, y, r) {   // Pickelhaube, (x,y) = Kopfmitte, r = Kopfradius
  ctx.fillStyle = '#16161a'; ctx.beginPath(); ctx.arc(x, y - r * 0.25, r * 1.02, Math.PI, 0); ctx.fill();
  rect(x - r * 1.15, y - r * 0.3, r * 2.3, r * 0.14, '#16161a');
  poly([[x - r * 0.12, y - r * 1.2], [x + r * 0.12, y - r * 1.2], [x, y - r * 1.75]], GOLD); rect(x - r * 0.16, y - r * 1.25, r * 0.32, r * 0.14, GOLD);
  ell(x, y - r * 0.72, r * 0.26, r * 0.3, GOLD);
}
function cap(x, y, r, band = RED) {   // Offiziers-Schirmmütze
  ell(x, y - r * 0.78, r * 1.12, r * 0.42, BLUE); rect(x - r * 0.92, y - r * 0.82, r * 1.84, r * 0.32, band);
  ell(x + r * 0.1, y - r * 0.46, r * 0.95, r * 0.16, '#111'); circ(x, y - r * 0.68, r * 0.1, GOLD);
}
function mustache(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x - r * 0.24, y + r * 0.3, r * 0.3, r * 0.11, -0.25, 0, 7); ctx.ellipse(x + r * 0.24, y + r * 0.3, r * 0.3, r * 0.11, 0.25, 0, 7); ctx.fill(); }
// Ganzkörper-Figuren der Szene
function soldier(x, y, s, o = {}) { person(x, y, s, { modern: true, tunic: BLUE, pants: '#1e1e26', skin: o.skin || '#e8b890', hair: '#5a3a1a', mood: o.mood || 'calm', look: o.look || [1, 0], arms: o.arms, walk: o.walk, t: o.t, sweat: o.sweat });
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); helmet(0, -330, 62); rect(-48, -200, 96, 10, '#e8e0c8');
  if (o.rifle) { ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(70, -60); ctx.lineTo(70, -420); ctx.stroke(); }
  if (o.paul) { ctx.restore(); return; } ctx.restore(); }
function captain(x, y, s, o = {}) { person(x, y, s, { coat: '#1e2848', skin: '#e0a882', hair: '#8a8a88', mood: o.mood || 'angry', look: o.look || [1, 0], arms: o.arms || [0.2, 0.2], walk: o.walk, t: o.t });
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); for (let i = 0; i < 4; i++) circ(-14, -250 + i * 40, 6, GOLD); for (let i = 0; i < 4; i++) circ(14, -250 + i * 40, 6, GOLD);
  rect(-62, -275, 30, 12, GOLD); rect(32, -275, 30, 12, GOLD); mustache(0, -326, 62, '#9a9a98'); cap(0, -330, 62); ctx.restore(); }
function civil(x, y, s, o = {}) { person(x, y, s, { coat: o.coat || '#2a2a2e', skin: o.skin || '#e8b890', hair: o.hair || '#4a3a2a', mood: o.mood || 'calm', look: o.look || [0, 0], arms: o.arms, walk: o.walk, t: o.t, sweat: o.sweat });
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); if (o.mus) mustache(0, -326, 62, o.mus); if (o.tophat) { rect(-56, -396, 112, 14, '#111'); rrect(-40, -480, 80, 90, 6, '#111'); } ctx.restore(); }
// Brustbild für Nahaufnahmen: (x,y) Kopfmitte, r Kopfradius
function bust(x, y, r, o = {}) {
  const skin = o.skin || '#e8b890';
  rrect(x - r * 1.05, y + r * 0.85, r * 2.1, r * 3.4, r * 0.45, o.body || BLUE);
  if (o.collar) rect(x - r * 0.5, y + r * 0.85, r, r * 0.3, o.collar);
  if (o.buttons) for (let i = 0; i < 4; i++) circ(x, y + r * 1.45 + i * r * 0.42, r * 0.07, GOLD);
  if (o.apron) rrect(x - r * 0.75, y + r * 1.3, r * 1.5, r * 3, r * 0.2, '#8a6a42');
  circ(x, y, r, skin); circ(x - r, y + r * 0.05, r * 0.2, skin); circ(x + r, y + r * 0.05, r * 0.2, skin);
  ctx.fillStyle = o.hair || '#5a3a1a'; ctx.beginPath(); ctx.arc(x, y - r * 0.14, r * 1.03, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  face(x, y + r * 0.05, r, o.mood || 'calm', o.look || [0, 0], { brow: o.brow || '#3a2418' });
  if (o.mus) mustache(x, y + r * 0.05, r, o.mus);
  if (o.helmet) helmet(x, y, r); if (o.cap) cap(x, y, r);
}

// ---------- Kulissen ----------
function facades(base, o = {}) {
  const cols = ['#d8c8a8', '#c8a888', '#b8b0a0', '#d0b898', '#c0a080'];
  for (let i = 0; i < 6; i++) { const x = -200 + i * 260, h = 1050 + (i % 2) * 120;
    rect(x, base - h, 250, h, cols[i % 5]); rect(x, base - h, 250, 30, 'rgba(0,0,0,0.15)'); rect(x - 6, base - h - 20, 262, 24, '#8a7a68');
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { const wx = x + 30 + c * 75, wy = base - h + 70 + r * 230; rect(wx, wy, 50, 130, o.night ? '#f0c870' : '#3a4a5a'); rect(wx - 6, wy - 16, 62, 14, '#8a7a68'); }
    rect(x + 85, base - 260, 80, 260, '#4a3020'); }
}
function cobbles(y0) { rect(-300, y0, W + 600, H + 400 - y0, '#6a6460'); ctx.fillStyle = 'rgba(0,0,0,0.18)'; for (let y = y0 + 20; y < H + 200; y += 46) for (let x = -300 + ((y / 46) % 2) * 40; x < W + 300; x += 80) { ctx.beginPath(); ctx.ellipse(x, y, 34, 16, 0, 0, 7); ctx.fill(); } }
function lamp(x, base, s) { ctx.save(); ctx.translate(x, base); ctx.scale(s, s); rect(-8, -620, 16, 620, '#2a2a2e'); poly([[-40, -680], [40, -680], [28, -610], [-28, -610]], '#2a2a2e'); rect(-24, -670, 48, 54, '#f2d890'); ctx.restore(); }
function carriage(x, base, s, t) { ctx.save(); ctx.translate(x, base); ctx.scale(s, s);
  const lg = Math.sin(t * 8) * 18; ell(-260, -240, 110, 60, '#5a3a22'); ell(-170, -300, 36, 60, '#5a3a22', 0.5); ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = 18; for (const lx of [-330, -300, -220, -190]) { ctx.beginPath(); ctx.moveTo(lx, -200); ctx.lineTo(lx + (lx % 20 ? lg : -lg), -10); ctx.stroke(); }
  rrect(-80, -360, 300, 230, 30, '#2a1a12'); rect(-50, -330, 100, 90, '#c8d8e0'); rect(80, -330, 100, 90, '#c8d8e0');
  for (const wx of [-30, 180]) { ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(wx, -80, 75, 0, 7); ctx.stroke(); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI + t * 5; ctx.beginPath(); ctx.moveTo(wx + Math.cos(a) * 75, -80 + Math.sin(a) * 75); ctx.lineTo(wx - Math.cos(a) * 75, -80 - Math.sin(a) * 75); ctx.stroke(); } }
  ctx.restore(); }
function street(t, o = {}) { sky(o.night ? '#1a2240' : '#a8b8c8', o.night ? '#3a3a58' : '#e8e0d0', 900); facades(1350, o); cobbles(1350); lamp(160, 1450, 1.0); lamp(940, 1450, 1.0); }
function office(t) {
  rect(-200, -200, W + 400, H + 400, '#6a4a32'); for (let x = -200; x < W + 200; x += 120) rect(x, -200, 8, 1700, 'rgba(0,0,0,0.15)');
  rect(-200, 1500, W + 400, 700, '#4a3020');
  rrect(380, 300, 320, 400, 10, '#c8a860'); rrect(400, 320, 280, 360, 8, '#7a8a9a'); circ(540, 450, 70, '#e8b890'); mustache(540, 450, 70, '#5a4030');  // Kaiserbild
  rect(530, 220, 20, 80, '#3a2418');
  rect(100, 1300, 880, 50, '#3a2418'); rect(130, 1350, 50, 300, '#2a1a10'); rect(900, 1350, 50, 300, '#2a1a10');
  rrect(240, 1250, 180, 60, 6, '#f2ead8'); rrect(640, 1230, 70, 80, 10, '#1a1a1a');
}
function rathaus(t) {
  sky('#9ab0c8', '#e8dcc8', 1000);
  rect(140, 560, 800, 900, '#a8452e'); rect(430, 180, 220, 420, '#9a3e28'); poly([[410, 190], [670, 190], [540, 20]], '#3a4a48');
  circ(540, 330, 60, '#f2ead8'); ctx.strokeStyle = '#222'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(540, 330); ctx.lineTo(540, 290); ctx.moveTo(540, 330); ctx.lineTo(570, 340); ctx.stroke();
  for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) { if (r === 2 && c === 2) continue; const x = 190 + c * 150, y = 640 + r * 230; rrect(x, y, 90, 150, [45, 45, 0, 0], '#2a3440'); }
  rrect(450, 1150, 180, 310, [90, 90, 0, 0], '#3a2214');
  ctx.font = `60px ${CAP}`; ctx.fillStyle = '#f2ead8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RATHAUS', 540, 1110);
  cobbles(1460);
}
function train(x, y, s, t) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rrect(-420, -260, 260, 200, 10, '#2a2a30'); rect(-470, -330, 80, 90, '#2a2a30'); rrect(-160, -200, 380, 140, 70, '#1a1a20'); rect(120, -340, 60, 150, '#1a1a20'); rect(-120, -110, 340, 20, RED);
  rrect(250, -240, 420, 180, 10, '#3a5a3a'); for (let i = 0; i < 4; i++) rect(280 + i * 95, -210, 70, 70, '#e8d8a0');
  for (const wx of [-340, -220, -40, 120, 320, 580]) { circ(wx, -40, wx > -100 && wx < 200 ? 60 : 42, '#111'); circ(wx, -40, 14, '#8a8a8a'); }
