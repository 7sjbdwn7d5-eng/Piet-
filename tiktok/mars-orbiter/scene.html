<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mars Climate Orbiter</title>
<style>
  @font-face { font-family: 'Anton'; src: url('../fonts/anton-latin-400-normal.woff2') format('woff2'); }
  html,body{margin:0;background:#000} canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  Story-Format: "Mars Climate Orbiter (1999): Pfund statt Newton"
//  Flache Vektor-Illustration, Figuren mit Mimik, Kamera-Moves,
//  unscharfe Hintergründe, 2–3-Wort-Untertitel, REAL-Fakten-Schild.
// ============================================================
const W = 1080, H = 1920;
let ctx = document.getElementById('c').getContext('2d');
const MAIN = ctx;
const OFF = {};
const CAP = '"Anton", "Inter", sans-serif', UI = '"Inter", sans-serif';

// ---- Zeitplan (Video-Sekunden) – auf den Sprecher gelegt ----
const T = {
  space: 0, control: 2.4, lisa: 3.5, mars: 4.55, journey: 6.85, worry: 8.85, screen: 11.0, burn: 13.15, behind: 14.7, wait: 16.75,
  nosignal: 18.7, low: 19.85, burnup: 21.85, reason: 23.55, units: 24.2, nobody: 27.35, money: 29.6, end: 32.85, out: 38.5,
};
window.DURATION = T.out;
const SHOTS = Object.keys(T).filter(k => k !== 'out');
const REAL = [
  [0.4, T.control + 0.9, 'Mars Climate Orbiter – echte NASA-Mission'],
  [T.journey + 0.2, T.worry + 1.2, 'Start: 11.12.1998 · Ankunft: 23.9.1999'],
  [T.screen + 0.1, T.burn, 'Die Bahn wich über Monate langsam ab'],
  [T.low + 0.1, T.reason, 'Geplant ca. 226 km Höhe – tatsächlich ca. 57 km'],
  [T.units + 0.1, T.money, 'Pfund-Sekunden statt Newton-Sekunden'],
  [T.money + 0.1, T.end, 'Die Sonde kostete rund 125 Mio. Dollar'],
];
// Untertitel: wird von captions.json ersetzt, falls vorhanden (window.CAPTIONS)
let CAPTIONS = window.CAPTIONS || [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, k) { const A = hex(a), B2 = hex(b); return `rgb(${lerp(A[0], B2[0], k) | 0},${lerp(A[1], B2[1], k) | 0},${lerp(A[2], B2[2], k) | 0})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(1979); const rr = (a, b) => lerp(a, b, R());
function shotOf(t) { let s = SHOTS[0]; for (const k of SHOTS) if (t >= T[k]) s = k; return s; }
function nextT(k) { const i = SHOTS.indexOf(k); return i < SHOTS.length - 1 ? T[SHOTS[i + 1]] : T.out; }
// Schnelle Unschärfe: Ebene in kleiner Auflösung zeichnen und hochskaliert einblenden (statt teurem ctx.filter)
function layer(factor, fn, filter = 'none') {
  const key = factor; if (!OFF[key]) { const c = document.createElement('canvas'); c.width = Math.ceil(W / factor); c.height = Math.ceil(H / factor); OFF[key] = c; }
  const oc = OFF[key], o = oc.getContext('2d'), main = ctx, m = main.getTransform();
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height);
  o.setTransform(m.a / factor, m.b / factor, m.c / factor, m.d / factor, m.e / factor, m.f / factor);
  ctx = o; try { fn(); } finally { ctx = main; }
  main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.imageSmoothingEnabled = true; main.imageSmoothingQuality = 'high'; main.filter = filter; main.drawImage(oc, 0, 0, W, H); main.restore();
}
function blurred(px, fn) { layer(px >= 10 ? 7 : 5, fn); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

// ============================================================
//  FIGUREN (flacher Stil, große Augen, Mimik)
// ============================================================
// mood: 'calm' | 'happy' | 'worried' | 'shock' | 'sad'
function face(x, y, r, mood, look = [0, 0], o = {}) {
  const eyeR = r * 0.2, ex = r * 0.36, ey = -r * 0.05;
  for (const s of [-1, 1]) {
    const open = mood === 'shock' ? 1.25 : 1;
    ell(x + s * ex, y + ey, eyeR * open, eyeR * 1.15 * open, '#ffffff');
    circ(x + s * ex + look[0] * eyeR * 0.45, y + ey + look[1] * eyeR * 0.45, eyeR * (mood === 'shock' ? 0.45 : 0.6), '#231a17');
    circ(x + s * ex + look[0] * eyeR * 0.45 - eyeR * 0.18, y + ey + look[1] * eyeR * 0.45 - eyeR * 0.2, eyeR * 0.16, '#fff');
    // Augenbrauen: innen höher = besorgt/traurig, innen tiefer = wütend
    ctx.strokeStyle = o.brow || '#3a2418'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round'; ctx.beginPath();
    const by = y + ey - eyeR * 1.55 - (mood === 'shock' ? eyeR * 0.5 : 0) - (mood === 'happy' ? eyeR * 0.15 : 0);
    const innerUp = mood === 'worried' || mood === 'sad' ? eyeR * 0.55 : mood === 'angry' ? -eyeR * 0.5 : 0;
    ctx.moveTo(x + s * (ex - eyeR * 0.9), by - innerUp); ctx.lineTo(x + s * (ex + eyeR), by + innerUp * 0.3);
    ctx.stroke();
  }
  // Mund
  ctx.strokeStyle = '#3a1f17'; ctx.lineWidth = r * 0.07; ctx.beginPath();
  const my = y + r * 0.45;
  if (mood === 'happy') ctx.arc(x, my - r * 0.12, r * 0.22, 0.2, Math.PI - 0.2);
  else if (mood === 'shock') { ctx.stroke(); ell(x, my, r * 0.12, r * 0.16, '#3a1f17'); return; }
  else if (mood === 'worried' || mood === 'sad') ctx.arc(x, my + r * 0.14, r * 0.18, Math.PI + 0.4, -0.4);
  else { ctx.moveTo(x - r * 0.14, my); ctx.lineTo(x + r * 0.14, my); }
  ctx.stroke();
}
function sweat(x, y, s, t) { const k = (t * 1.2) % 1; ctx.save(); ctx.globalAlpha = 1 - k * 0.6; ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.moveTo(x, y + k * 20 * s - 18 * s); ctx.quadraticCurveTo(x + 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s + 10 * s); ctx.quadraticCurveTo(x - 12 * s, y + k * 20 * s + 6 * s, x, y + k * 20 * s - 18 * s); ctx.fill(); ctx.restore(); }
// Person (Ganzkörper). opts: skin, tunic, hair, mood, look, arms:[l,r] Winkel, walk, carry
function person(x, y, s, o = {}) {
  const skin = o.skin || '#e0a57a', tunic = o.tunic || '#c9583a', hair = o.hair || '#3a2418';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const w = o.walk || 0, lg = Math.sin(w) * 18;
  // Beine
  ctx.strokeStyle = skin; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -110); ctx.lineTo(-20 - lg, -8); ctx.moveTo(16, -110); ctx.lineTo(20 + lg, -8); ctx.stroke();
  ell(-22 - lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126'); ell(22 + lg, -4, 24, 11, o.modern || o.coat ? '#2a2420' : '#6a4126');
  if (o.coat) { poly([[-50, -275], [50, -275], [70, -60], [-70, -60]], o.coat); rect(-4, -270, 8, 200, 'rgba(0,0,0,0.25)'); }
  else if (o.modern) { ctx.strokeStyle = o.pants || '#3a4a6a'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(-16, -150); ctx.lineTo(-20 - lg, -12); ctx.moveTo(16, -150); ctx.lineTo(20 + lg, -12); ctx.stroke(); rrect(-48, -275, 96, 140, 22, tunic); poly([[-18, -275], [0, -250], [18, -275]], 'rgba(255,255,255,0.7)'); }
  else { poly([[-46, -270], [46, -270], [62, -105], [-62, -105]], tunic); rect(-50, -200, 100, 12, 'rgba(0,0,0,0.15)'); }
  // Arme
  const [al, ar] = o.arms || [0.15, -0.15];
  ctx.strokeStyle = skin; ctx.lineWidth = 20;
  for (const [sx, v] of [[-1, al], [1, ar]]) { const a = Math.abs(v); ctx.beginPath(); ctx.moveTo(sx * 40, -255); ctx.lineTo(sx * 40 + sx * Math.sin(a) * 105, -255 + Math.cos(a) * 105); ctx.stroke(); }
  // Kopf
  circ(0, -330, 62, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -342, 64, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(40, -360, 0, -362); ctx.fill();
  if (o.beard) { ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -318, 58, 0.15, Math.PI - 0.15); ctx.fill(); circ(0, -318, 40, skin); }
  face(0, -326, 62, o.mood || 'calm', o.look || [0, 0], { brow: hair });
  if (o.sweat) sweat(56, -380, 1.2, o.t || 0);
  if (o.hat) { rrect(-70, -392, 140, 22, 10, o.hat); rrect(-48, -440, 96, 56, 14, o.hat); }
  if (o.pillow) { rrect(-80, -440, 160, 56, 26, '#e9d8b8'); rect(-80, -414, 160, 6, '#c9b590'); }
  ctx.restore();
}
function sky(top, bot, y1 = 1300) { const g = ctx.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, y1 + 400); }
const stars = Array.from({ length: 200 }, () => ({ x: rr(-100, W + 100), y: rr(-200, 1200), r: rr(0.8, 2.6), b: rr(0.3, 1) }));
function starfield(t, a = 1) { for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${a * s.b * (0.7 + 0.3 * Math.sin(t * 2 + s.x))})`; ctx.fillRect(s.x, s.y, s.r, s.r); } }
function pine(x, y, s, c = '#1a2a24') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(-8, -40, 16, 40, '#2a1e16'); for (let i = 0; i < 4; i++) poly([[-90 + i * 15, -40 - i * 70], [0, -160 - i * 70], [90 - i * 15, -40 - i * 70]], c); ctx.restore(); }
function forestRow(base, n, s, c, seed = 1) { const r2 = rng(seed); for (let i = 0; i < n; i++) pine(-60 + i * (1200 / n) + r2() * 40, base + r2() * 30, s * (0.8 + r2() * 0.4), c); }
const SH = {};
function camera(scale, x = 0, y = 0) { ctx.translate(W / 2 + x, H / 2 + y); ctx.scale(scale, scale); ctx.translate(-W / 2, -H / 2); }


// ============================================================
//  MARS CLIMATE ORBITER – Kulissen & Figuren
// ============================================================
const LISA = { skin: '#f0c4a0', hair: '#6a3a1e', shirt: '#4a7ab0' };
function bustP(x, y, r, o = {}) {   // Brustbild (x,y)=Kopfmitte
  const skin = o.skin || LISA.skin, hair = o.hair || LISA.hair;
  if (o.long) { ctx.fillStyle = hair; ctx.beginPath(); ctx.roundRect(x - r * 1.12, y - r * 0.9, r * 2.24, r * 2.4, r * 0.9); ctx.fill(); }
  rrect(x - r * 1.1, y + r * 0.85, r * 2.2, r * 3.4, r * 0.5, o.shirt || LISA.shirt);
  if (o.badge) { rrect(x + r * 0.35, y + r * 1.35, r * 0.5, r * 0.32, 6, '#f2f2f2'); ctx.fillStyle = '#1a3a8a'; ctx.font = `${r * 0.16}px ${CAP}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('NASA', x + r * 0.6, y + r * 1.52); }
  circ(x, y, r, skin); circ(x - r, y + r * 0.05, r * 0.2, skin); circ(x + r, y + r * 0.05, r * 0.2, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(x, y - r * 0.14, r * 1.04, Math.PI * 1.0, Math.PI * 2.0); ctx.quadraticCurveTo(x + r * 0.5, y - r * 0.5, x - r * 0.2, y - r * 0.75); ctx.quadraticCurveTo(x - r * 0.7, y - r * 0.5, x - r * 1.04, y - r * 0.1); ctx.fill();
  if (o.glasses) { ctx.strokeStyle = '#222'; ctx.lineWidth = r * 0.05; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.36, y, r * 0.27, 0, 7); ctx.stroke(); } }
  face(x, y + r * 0.05, r, o.mood || 'calm', o.look || [0, 0], { brow: hair });
  if (o.headset) { ctx.strokeStyle = '#222'; ctx.lineWidth = r * 0.09; ctx.beginPath(); ctx.arc(x, y - r * 0.05, r * 1.12, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); rrect(x - r * 1.28, y - r * 0.25, r * 0.3, r * 0.5, r * 0.1, '#222'); ctx.lineWidth = r * 0.04; ctx.beginPath(); ctx.moveTo(x - r * 1.15, y + r * 0.2); ctx.quadraticCurveTo(x - r * 0.9, y + r * 0.75, x - r * 0.35, y + r * 0.62); ctx.stroke(); circ(x - r * 0.33, y + r * 0.62, r * 0.08, '#222'); }
  if (o.sweat) sweat(x + r * 0.95, y - r * 0.6, r / 40, o.t || 0);
}
// Mitarbeiter im Kontrollraum (von hinten/seitlich, klein)
function worker(x, y, s, o = {}) { person(x, y, s, { modern: true, tunic: o.shirt || '#d8d8d0', pants: '#2a2a3a', skin: o.skin || '#e0a57a', hair: o.hair || '#3a2418', mood: o.mood || 'calm', look: o.look || [0, -0.4], arms: o.arms || [0.5, 0.5], t: o.t, sweat: o.sweat }); }
const spaceStars = Array.from({ length: 300 }, () => ({ x: rr(-300, W + 300), y: rr(-300, H + 300), r: rr(0.6, 2.8), b: rr(0.3, 1) }));
function space(t, a = 1) { rect(-400, -400, W + 800, H + 800, '#03040c'); for (const s of spaceStars) { ctx.fillStyle = `rgba(255,255,255,${a * s.b * (0.7 + 0.3 * Math.sin(t * 2 + s.x))})`; ctx.fillRect(s.x, s.y, s.r, s.r); } }
function mars(x, y, r, t = 0) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r); g.addColorStop(0, '#f0915a'); g.addColorStop(0.7, '#c4552a'); g.addColorStop(1, '#7a2a14');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
  for (let i = 0; i < 9; i++) { const cx = x + Math.sin(i * 2.3 + t * 0.05) * r * 0.7, cy = y + Math.cos(i * 1.7) * r * 0.6; ell(cx, cy, r * (0.05 + (i % 3) * 0.03), r * (0.04 + (i % 3) * 0.025), 'rgba(90,30,10,0.35)'); }
  ell(x - r * 0.1, y - r * 0.15, r * 0.6, r * 0.08, 'rgba(110,40,15,0.35)', 0.2); ell(x, y - r * 0.92, r * 0.35, r * 0.12, 'rgba(255,245,235,0.85)');
  ctx.restore();
  const h = ctx.createRadialGradient(x, y, r * 0.95, x, y, r * 1.12); h.addColorStop(0, 'rgba(255,150,100,0.45)'); h.addColorStop(1, 'rgba(255,150,100,0)'); ctx.fillStyle = h; ctx.beginPath(); ctx.arc(x, y, r * 1.12, 0, 7); ctx.fill();
}
function earth(x, y, r) { const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); g.addColorStop(0, '#5ab0ff'); g.addColorStop(1, '#0a3a8a'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); ell(x - r * 0.3, y - r * 0.1, r * 0.4, r * 0.55, '#4f9a3f', 0.3); ell(x + r * 0.45, y + r * 0.3, r * 0.3, r * 0.4, '#5f9e48', -0.4); ctx.restore(); }
function probe(x, y, s, o = {}) {   // Mars Climate Orbiter (vereinfacht): Körper, ein Solarflügel, Antenne
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(s, s);
  if (o.fire) { const fl = 1 + 0.25 * Math.sin((o.t || 0) * 40); const g = ctx.createRadialGradient(-130, 0, 5, -130, 0, 160 * fl); g.addColorStop(0, 'rgba(255,250,210,1)'); g.addColorStop(0.4, 'rgba(255,170,60,0.9)'); g.addColorStop(1, 'rgba(255,90,20,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(-190, 0, 140 * fl, 50 * fl, 0, 0, 7); ctx.fill(); }
  if (o.glow) { const g = ctx.createRadialGradient(40, 0, 10, 0, 0, 260); g.addColorStop(0, `rgba(255,220,120,${o.glow})`); g.addColorStop(0.5, `rgba(255,110,30,${o.glow * 0.7})`); g.addColorStop(1, 'rgba(255,60,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 260, 0, 7); ctx.fill(); }
  rect(-110, -12, 20, 24, '#555'); poly([[-110, -24], [-140, -34], [-140, 34], [-110, 24]], '#666');
  rrect(-90, -70, 180, 140, 10, '#d8b04a'); ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 3; for (let i = -60; i <= 60; i += 30) { ctx.beginPath(); ctx.moveTo(-90, i); ctx.lineTo(90, i); ctx.stroke(); }
  rect(90, -8, 60, 16, '#888'); ctx.save(); ctx.translate(150, 0); for (let i = 0; i < 3; i++) { rect(i * 110, -70, 104, 140, '#1a2a6a'); ctx.strokeStyle = '#4a6ac8'; ctx.lineWidth = 2; for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(i * 110 + k * 26, -70); ctx.lineTo(i * 110 + k * 26, 70); ctx.stroke(); } } ctx.restore();
  ell(0, -110, 70, 20, '#e8e8e8'); rect(-4, -100, 8, 30, '#aaa');
  if (o.burn) { ctx.globalAlpha = o.burn; rect(-100, -80, 600, 160, '#2a1208'); }
  ctx.restore();
}
function controlRoom(t, o = {}) {
  rect(-200, -200, W + 400, H + 400, '#141a26');
  rrect(80, 260, 920, 520, 14, '#0a0e18'); rect(100, 280, 880, 480, o.red ? '#2a0808' : '#06223a');
  ctx.save(); ctx.beginPath(); ctx.rect(100, 280, 880, 480); ctx.clip();
  if (o.wall === 'orbit' || !o.wall) { mars(540, 520, 140, t); ctx.strokeStyle = '#3ddc84'; ctx.setLineDash([12, 10]); ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(540, 520, 330, 170, 0.1, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  if (o.wall === 'flat') { ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(100, 560); for (let x = 100; x < 980; x += 10) ctx.lineTo(x, 560 + (x < 400 ? Math.sin(x * 0.2 + t * 20) * 40 : 0)); ctx.stroke(); ctx.font = `90px ${CAP}`; ctx.fillStyle = '#ff3b30'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (Math.sin(t * 8) > -0.3) ctx.fillText('KEIN SIGNAL', 540, 400); }
  ctx.restore();
  ctx.font = `40px ${CAP}`; ctx.fillStyle = '#7fb0ff'; ctx.textAlign = 'left'; ctx.fillText('JPL · MISSION CONTROL', 110, 240);
  for (let r = 0; r < 2; r++) { const y = 1250 + r * 300; rect(-200, y, W + 400, 70, '#2a3242'); for (let c = 0; c < 5; c++) { const x = 30 + c * 220 + r * 60; rrect(x, y - 150, 170, 130, 8, '#0a0e18'); rect(x + 10, y - 140, 150, 100, ['#0a3a2a', '#0a2a4a', '#2a2a0a'][(c + r) % 3]); for (let k = 0; k < 4; k++) rect(x + 20, y - 128 + k * 22, 60 + ((c * 37 + k * 23 + Math.floor(t * 3)) % 70), 8, 'rgba(120,255,180,0.6)'); } }
}

// ---------- Einstellungen ----------
SH.space = (t, lt, len) => { ctx.save(); camera(1.0 + 0.08 * ease(lt / len));
  space(t); mars(700, 1150, 380, t); probe(lerp(150, 330, lt / len), 620, 0.7, { rot: 0.3 });
  ctx.restore();
  const k = backOut(clamp(lt / 0.35)) * (1 - clamp((lt - 1.9) / 0.3)); if (k > 0.01) { ctx.save(); ctx.translate(540, 560); ctx.scale(k, k); capText([['SEPTEMBER', '#fff'], ['1999', '#ffb020']], 0, 0, 150, true); ctx.restore(); } };
SH.control = (t, lt, len) => { ctx.save(); camera(1.05 - 0.05 * ease(lt / len));
  controlRoom(t);
  for (let i = 0; i < 4; i++) worker(150 + i * 260, 1560, 0.9, { shirt: ['#d8d8d0', '#a8c0e0', '#e0d0b0', '#c8d8c0'][i], hair: ['#3a2418', '#8a6a3a', '#1a1a1a', '#6a3a1e'][i], look: [0, -1] });
  ctx.restore(); };
SH.lisa = (t, lt, len) => { ctx.save(); camera(1.08 + 0.06 * ease(lt / len));

function capText(lines, x, y, size, stacked = false) {

function renderFrame(t) {
