<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Der Zuschauer-Effekt</title>
<style>html,body{margin:0;background:#000} canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  Gleichnis-Format (Vorlage, nach Vorbild-Video des Nutzers):
//  Teil 1 = Geschichte im dunklen Raum mit Hängelampe (warmes Licht, Holzboden),
//  Teil 2 = „Und du?" – schwarzer Hintergrund, weiße Strichmännchen, gelbe Helfer-Figur.
//  Text: EIN Wort groß oben, Zähler oben links (kleines Label + große farbige Zahl).
// ============================================================
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const UI = '"Inter", sans-serif';

const T = {
  exp: 0, alone: 1.55, smoke: 5.41, report: 7.16, again: 10.73, strangers: 12.03, calm: 14.18, fill: 16.58, one: 18.08,
  dumb: 20.13, collapse: 21.68, crowd: 23.98, think: 25.93, trick: 28.4, jacket: 30.55, call: 32.1, end: 33.6, out: 38.9,
};
window.DURATION = T.out;
const SHOTS = Object.keys(T).filter(k => k !== 'out');
let CAPTIONS = []; window.setCaptions = c => { CAPTIONS = c; };

// Zähler oben links: [von, bis, Label, Wertfunktion(lt global t), Farbe]
const COUNTERS = [
  [T.report + 0.3, T.again, 'Gemeldet', t => '75 %', '#3ddc84'],
  [T.one + 0.2, T.dumb, 'Gemeldet', t => '10 %', '#ff4d3d'],
  [T.crowd, T.trick, 'Zuschauer', t => Math.min(20, 1 + Math.floor((t - T.crowd) * 12)), '#ff6ec7'],
];
const NUMCOL = n => n >= 1000 || n >= 50 ? '#ff4d3d' : n >= 100 || n >= 20 ? '#ff6ec7' : '#3fa0ff';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const backOut = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function shotOf(t) { let s = SHOTS[0]; for (const k of SHOTS) if (t >= T[k]) s = k; return s; }
function nextT(k) { const i = SHOTS.indexOf(k); return i < SHOTS.length - 1 ? T[SHOTS[i + 1]] : T.out; }
const circ = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
const ell = (x, y, rx, ry, c, rot = 0) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); };
const rrect = (x, y, w, h, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
// weiter herausgezoomt (Nutzer-Wunsch): Zoom-Stärke halbiert, Grundbild etwas kleiner; Mittelpunkt Richtung Bildmitte gezogen
function camera(s, x = 0, y = 0, cx = W / 2, cy = H / 2) { const z = 0.9 + (s - 1) * 0.5; const ccx = lerp(cx, W / 2, 0.45), ccy = lerp(cy, FLOOR - 150, 0.35); ctx.translate(ccx + x, ccy + y); ctx.scale(z, z); ctx.translate(-ccx, -ccy); }

const FLOOR = 1330;

  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#120e0b'); g.addColorStop(0.68, '#2a2119'); g.addColorStop(1, '#16110d'); ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 800, H + 800);

  ctx.fillStyle = `rgba(255,210,90,${L})`; ctx.beginPath(); ctx.ellipse(540, 300, 70, 10, 0, 0, 7); ctx.fill();

    ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(440, 300); ctx.lineTo(640, 300); ctx.lineTo(1000, FLOOR + 160); ctx.lineTo(80, FLOOR + 160); ctx.fill();

// Elefant (Seitenansicht). s = Größe; o.pull 0..1 (nach links ziehen), o.lie (liegt), o.sad, o.legX Rückgabe Fußposition
function elephant(x, y, s, o = {}) {

  for (const lx of [-60, 90]) ell(lx, -4, 28, 8, '#d8d2c8');

  ell(hx - 55, hy + 5, 50, 70, 'rgba(220,170,170,0.35)', o.sad ? 0.3 : -0.1);

  ctx.strokeStyle = '#4a4e56'; ctx.lineWidth = 6; ctx.beginPath(); if (o.sad) { ctx.moveTo(hx + 12, hy - 50); ctx.lineTo(hx + 58, hy - 38); } else { ctx.moveTo(hx + 14, hy - 44); ctx.lineTo(hx + 58, hy - 46); } ctx.stroke();
  if (o.sweat) { ctx.fillStyle = '#9fd8ff'; const k = ((o.t || 0) * 1.3) % 1; ctx.beginPath(); ctx.ellipse(hx + 80, hy - 70 + k * 30, 9, 13, 0, 0, 7); ctx.fill(); }
  ctx.restore();

  return [x + (-95) * s, y - 20 * s];
}
function stake(x, y, s = 1, wob = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(wob); ctx.scale(s, s); rrect(-14, -70, 28, 80, 6, '#8a6238'); ctx.fillStyle = '#6a4826'; ctx.beginPath(); ctx.moveTo(-18, -70); ctx.lineTo(18, -70); ctx.lineTo(0, -92); ctx.fill(); ctx.restore(); }
function rope(x1, y1, x2, y2, taut = 1, w = 5) { ctx.strokeStyle = '#d8c69a'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 40 * (1 - taut), x2, y2); ctx.stroke(); }
function boundary(cx, cy, r, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#e8473a'; ctx.lineWidth = 5; ctx.setLineDash([22, 16]); ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.22, 0, 0, 7); ctx.stroke(); ctx.restore(); }

  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const lg = Math.sin(walk) * 14; ctx.strokeStyle = '#2a2a34'; ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14, -150); ctx.lineTo(-18 - lg, 0); ctx.moveTo(14, -150); ctx.lineTo(18 + lg, 0); ctx.stroke();
  rrect(-55, -330, 110, 200, 24, '#3a3e4c'); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; for (const dx of [-25, 25]) { ctx.beginPath(); ctx.moveTo(dx, -320); ctx.lineTo(dx, -140); ctx.stroke(); }
  circ(0, -380, 52, '#f0c8a8'); ell(0, -345, 44, 26, '#f2f2f2');   // Bart
  circ(-16, -392, 6, '#1a1410'); circ(16, -392, 6, '#1a1410'); ell(0, -372, 9, 7, '#e8a088');
  ell(0, -425, 90, 16, '#5a3e2a'); rrect(-46, -480, 92, 58, 18, '#6a4a32'); ctx.fillStyle = '#3a2618'; ctx.fillRect(-46, -436, 92, 12);
  ctx.restore();

// ============================================================
//  TEIL 2: Strichmännchen auf Schwarz
// ============================================================
function black() { ctx.fillStyle = '#000'; ctx.fillRect(-400, -400, W + 800, H + 800); }
function stick(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = o.col || '#f4f4f4'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const w = o.walk || 0, lg = Math.sin(w) * 22;
  ctx.beginPath(); ctx.arc(0, -330, 40, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -290); ctx.lineTo(0, -130); ctx.moveTo(0, -130); ctx.lineTo(-30 - lg, 0); ctx.moveTo(0, -130); ctx.lineTo(30 + lg, 0);
  const [al, ar] = o.arms || [0.35, 0.35];
  ctx.moveTo(0, -260); ctx.lineTo(-Math.sin(al) * 110, -260 + Math.cos(al) * 110); ctx.moveTo(0, -260); ctx.lineTo(Math.sin(ar) * 110, -260 + Math.cos(ar) * 110); ctx.stroke();
  if (o.mouth === 'sad') { ctx.beginPath(); ctx.arc(0, -305, 14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  if (o.mouth === 'laugh') { ctx.beginPath(); ctx.arc(0, -325, 16, 0.2, Math.PI - 0.2); ctx.stroke(); }
  ctx.restore();
}
function bubble(x, y, text, k = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.font = `800 46px ${UI}`; const w = ctx.measureText(text).width + 60;
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 4; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(-w / 2, -50, w, 100, 30); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20, 50); ctx.lineTo(-40, 90); ctx.lineTo(10, 50); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4f4f4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2); ctx.restore();
}

// ============================================================
//  SHOTS
// ============================================================
const BX = 600, BY = FLOOR + 40;      // Position Elefant (Füße)
const SX = 230, SY = FLOOR + 70;      // Pflock
// ---------- Experiment-Raum ----------
const DESK_Y = FLOOR + 40;
function deskRoom(t, o = {}) {
  room(t, 1);
  // Lüftungsgitter + Tür
  rrect(110, 760, 170, 110, 8, '#4a443e'); ctx.strokeStyle = '#2a2622'; ctx.lineWidth = 6; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(122, 780 + i * 20); ctx.lineTo(268, 780 + i * 20); ctx.stroke(); }
  rrect(860, 760, 190, 580, 6, '#3a2e24'); circ(880, 1060, 10, '#c8a060');
  // Tisch
  rrect(170, DESK_Y - 160, 740, 34, 8, '#6a4a30'); ctx.fillStyle = '#4a3420'; ctx.fillRect(200, DESK_Y - 126, 24, 140); ctx.fillRect(856, DESK_Y - 126, 24, 140);
}
function seated(x, s, o = {}) {

  rrect(-55, -150, 110, 20, 6, '#3a2a1e'); ctx.fillStyle = '#3a2a1e'; ctx.fillRect(-50, -130, 12, 130); ctx.fillRect(38, -130, 12, 130); ctx.fillRect(-55, -330, 16, 190);   // Stuhl
  rrect(-50, -340, 100, 200, 30, o.shirt || '#3a6ab0');
  const cough = o.cough ? Math.sin((o.t || 0) * 18) * 6 : 0;
  ctx.save(); ctx.translate(0, cough);
  circ(0, -400, 58, o.skin || '#f0c8a8'); ctx.fillStyle = o.hair || '#4a2c1a'; ctx.beginPath(); ctx.arc(0, -414, 61, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  const lx = o.look || 0;
  for (const sx of [-1, 1]) { circ(sx * 20 + lx * 6, -400, 11, '#fff'); circ(sx * 20 + lx * 9, -398, 6, '#1a1410'); }
  ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
  if (o.mood === 'worried') { ctx.moveTo(-32, -428); ctx.lineTo(-10, -422); ctx.moveTo(32, -428); ctx.lineTo(10, -422); } else { ctx.moveTo(-30, -424); ctx.lineTo(-10, -424); ctx.moveTo(30, -424); ctx.lineTo(10, -424); }
  ctx.stroke(); ctx.beginPath(); if (o.cough) ctx.arc(0, -372, 8, 0, 7); else if (o.mood === 'worried') ctx.arc(0, -362, 12, Math.PI * 1.15, Math.PI * 1.85); else ctx.arc(0, -378, 12, 0.3, Math.PI - 0.3); ctx.stroke();
  ctx.restore();

  const wr = o.writing ? Math.sin((o.t || 0) * 9) * 8 : 0;
  ctx.strokeStyle = o.shirt || '#3a6ab0'; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(30, -300); ctx.lineTo(70 + wr, -175); ctx.stroke(); circ(72 + wr, -170, 12, o.skin || '#f0c8a8');
  ctx.restore();

}
const puffs2 = Array.from({ length: 140 }, (_, i) => ({ a: Math.sin(i * 12.9898) * 43758.5453 % 1, b: Math.sin(i * 78.233) * 12345.678 % 1 }));
function smoke(t, amount) {   // amount 0..1
  const n = Math.floor(140 * amount);
  for (let i = 0; i < n; i++) { const p = puffs2[i], a = Math.abs(p.a), b = Math.abs(p.b);
    const age = (t * 0.15 + a) % 1, sx = 200 + (i / 140) * 900 * amount + Math.sin(t + i) * 30, sy = 820 + (b - 0.3) * 700 * amount - age * 120;
    ctx.fillStyle = `rgba(190,190,195,${0.12 + 0.1 * amount})`; ctx.beginPath(); ctx.arc(i < 12 ? 300 + age * 220 : sx, i < 12 ? 815 - age * 80 : sy, 50 + 90 * amount * b + age * 40, 0, 7); ctx.fill(); }
}
const CROWD = []; for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) { const y = r ? 1400 : 1500, sc = r ? 0.5 : 0.6; CROWD.push([60 + c * 52 + r * 26, y, sc], [800 + c * 52 + r * 26, y, sc]); }
CROWD.sort((p, q) => q[1] - p[1] ? p[1] - q[1] : 0); const RED = CROWD.findIndex(p => p[0] === 852 && p[1] === 1500);
const SH = {
  exp(t, lt, len) { ctx.save(); camera(1.1 - 0.05 * ease(lt / len)); deskRoom(t); ctx.restore(); },
  alone(t, lt, len) { ctx.save(); camera(1.15, 0, 0, 540, DESK_Y - 300); deskRoom(t); seated(540, 1.1, { writing: true, t, paper: true }); ctx.restore(); },
  smoke(t, lt, len) { ctx.save(); camera(1.5, 0, 0, 260, 820); deskRoom(t); seated(540, 1.1, { writing: true, t, paper: true }); smoke(t, 0.12 + 0.1 * lt / len); ctx.restore(); },
  report(t, lt, len) { const k = ease(clamp((lt - 0.3) / 2.2)); ctx.save(); camera(1.0); deskRoom(t); smoke(t, 0.25);
    if (k < 0.05) seated(540, 1.1, { mood: 'worried', look: -1, t, paper: true });
    else { ctx.save(); ctx.translate(lerp(540, 940, k), 0); hatlessWalker(t); ctx.restore(); }
    ctx.restore(); },
  again(t, lt, len) { ctx.save(); camera(1.05); deskRoom(t); seated(540, 1.1, { writing: true, t, paper: true }); ctx.restore();
    ctx.save(); ctx.globalAlpha = 1 - clamp(lt / 0.8); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(540, 900, 110, -0.3, Math.PI * 1.5); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(540, 760); ctx.lineTo(600, 790); ctx.lineTo(540, 830); ctx.fill(); ctx.restore(); },
  strangers(t, lt, len) { const k = ease(clamp(lt / 0.8)); ctx.save(); camera(1.0); deskRoom(t); seated(540, 1.0, { look: 1, t, paper: true });

  calm(t, lt, len) { ctx.save(); camera(1.6, 0, 0, 540, DESK_Y - 380); deskRoom(t); smoke(t, 0.15 + 0.15 * lt / len); seated(300, 1.0, { shirt: '#6a8a3a', hair: '#2a1a10', writing: true, t, paper: true }); seated(540, 1.0, { look: 1, mood: 'worried', t, paper: true }); seated(780, 1.0, { shirt: '#8a3a5a', hair: '#c89a4a', skin: '#c8906a', writing: true, t: t + 1, paper: true }); ctx.restore(); },
  fill(t, lt, len) { ctx.save(); camera(1.0); deskRoom(t); seated(300, 1.0, { shirt: '#6a8a3a', hair: '#2a1a10', writing: true, t, paper: true }); seated(540, 1.0, { look: Math.sin(t * 2), mood: 'worried', cough: lt > 0.6, t, paper: true }); seated(780, 1.0, { shirt: '#8a3a5a', hair: '#c89a4a', skin: '#c8906a', writing: true, t: t + 1, paper: true }); smoke(t, 0.35 + 0.4 * lt / len); ctx.restore(); },
  one(t, lt, len) { ctx.save(); camera(1.05); deskRoom(t); seated(300, 1.0, { shirt: '#6a8a3a', hair: '#2a1a10', writing: true, t, paper: true }); seated(540, 1.0, { look: -1, mood: 'worried', cough: true, t, paper: true }); seated(780, 1.0, { shirt: '#8a3a5a', hair: '#c89a4a', skin: '#c8906a', writing: true, t: t + 1, paper: true }); smoke(t, 1); ctx.restore(); },
  dumb(t, lt, len) { black(); stick(540, 1500, 1.4, { arms: [0.6, 2.2 + Math.sin(t * 10) * 0.1], mouth: 'laugh' }); },
  collapse(t, lt, len) { black(); const k = ease(clamp((lt - 0.4) / 0.6)); ctx.save(); ctx.translate(540, 1500); ctx.rotate(-1.5 * k); stick(0, 0, 1.1, { arms: [0.4 + k, 0.4 + k] }); ctx.restore(); },
  crowd(t, lt, len) { black(); ctx.save(); ctx.translate(400, 1500); ctx.rotate(1.5); stick(0, 0, 1.0, { arms: [1.4, 1.4] }); ctx.restore();
    const n = Math.min(20, 1 + Math.floor(lt * 12)); for (let i = 0; i < n; i++) { const [x, y, s] = CROWD[i];
      stick(x, y, s, { arms: i % 3 === 0 ? [0.3, 1.5] : [0.3, 0.3] }); if (i % 3 === 0) { ctx.fillStyle = '#f4f4f4'; ctx.fillRect(x + 40 * s / 0.55 - 8, y - 200 * s / 0.55, 16, 26); } } },
  think(t, lt, len) { SH.crowd(t, 5, 5); const k = backOut(clamp((lt - 0.2) / 0.4)); for (const [x, y] of [[270, 1080], [810, 1080], [540, 910]]) { ctx.save(); ctx.translate(x, y); ctx.scale(k * 0.95, k * 0.95); bubble(0, 0, 'Jemand hilft schon.', 1); ctx.restore(); } },
  trick(t, lt, len) { SH.crowd(t, 5, 5); stick(600, 1390, 1.0, { col: '#ffd23f', arms: [0.3, 2.0 + Math.sin(t * 6) * 0.1] }); },
  jacket(t, lt, len) { SH.crowd(t, 5, 5); stick(600, 1390, 1.0, { col: '#ffd23f', arms: [0.3, 1.8] });
    const [x, y, s] = CROWD[RED]; ctx.save(); ctx.strokeStyle = '#ff4d3d'; ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y - s * 290); ctx.lineTo(x, y - s * 130); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle = '#ffd23f'; ctx.setLineDash([12, 10]); ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(700, 1140); ctx.lineTo(x - 20, y - s * 300); ctx.stroke(); ctx.restore(); },
  call(t, lt, len) { SH.jacket(t, lt, len); const [x] = CROWD[RED]; bubble(x - 40, 1080, 'Ruf die 112!', backOut(clamp(lt / 0.3))); ctx.save(); ctx.font = `900 54px ${UI}`; ctx.fillStyle = '#3ddc84'; ctx.textAlign = 'center'; ctx.globalAlpha = clamp((lt - 0.6) / 0.3); ctx.fillText('📞 112', x - 40, 1200); ctx.restore(); },
