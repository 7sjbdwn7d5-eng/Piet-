<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Niemand kann lügen</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============================================================
//  "Was wäre, wenn ab morgen niemand mehr lügen könnte?"
//  renderFrame(t) zeichnet das Bild zur Video-Zeit t (Sekunden).
// ============================================================
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const FONT = '"Inter", "Inter Display", sans-serif';

const B = [0, 2.95, 10.8, 16.7, 22.9, 29.35, 37.0];   // Schnitte = Zeilenanfänge
const S = { hook: [B[0], B[1]], now: [B[1], B[2]], week: [B[2], B[3]], year: [B[3], B[4]], tenk: [B[4], B[5]], outro: [B[5], B[6]] };
const TRUTH = 1.55;                  // Hook: "... niemand mehr lügen ..." -> Lügendetektor wird ruhig
const ASK = B[1] + 1.85, HATE = B[1] + 3.95, AD = B[1] + 5.25;   // Büro: Frage / Antwort / Werbung
const TV = B[2] + 3.0;               // Politiker
const CONF = B[3] + 1.9, GAVEL = B[3] + 2.5, SHOP = B[3] + 3.55;  // Gericht / Bewertungen
const GIFT = B[4] + 3.3;             // Geschenk
const WIPES = [AD, TV, SHOP, GIFT];
window.DURATION = B[6];

const SCENES = [
  { key: 'now', pre: '', big: 'SOFORT', node: 'Sofort',
    counter: lt => 'TAG 1 · 0' + Math.min(9, 8 + Math.floor(lt / 4)) + ':' + String(Math.floor(lt * 7) % 60).padStart(2, '0') + ' UHR',
    facts: [{ at: 0.9, text: 'Dein Chef fragt: *„Wie geht’s?“*' },
            { at: AD - B[1], text: 'Jede *Werbung* sagt plötzlich die Wahrheit.' }] },
  { key: 'week', pre: 'NACH', big: '1 WOCHE', node: '1 Woche',
    counter: lt => 'TAG ' + Math.min(7, 1 + Math.floor(7 * lt / (B[3] - B[2] - 0.3))) + ' VON 7',
    facts: [{ at: 0.9, text: 'Tausende *Beziehungen* gehen kaputt.' },
            { at: TV - B[2], text: 'Politiker geben *keine Interviews* mehr.' }] },
  { key: 'year', pre: 'NACH', big: '1 JAHR', node: '1 Jahr',
    counter: lt => 'MONAT ' + Math.min(12, 1 + Math.floor(12 * lt / (B[4] - B[3] - 0.3))) + ' VON 12',
    facts: [{ at: 0.8, text: 'Vor Gericht *gesteht* jeder sofort.' },
            { at: SHOP - B[3], text: 'Online-Bewertungen sind *ehrlich*.' }] },
  { key: 'tenk', pre: 'NACH', big: '10 JAHREN', node: '10 Jahre',
    counter: lt => 'JAHR ' + Math.min(10, 1 + Math.floor(10 * lt / (B[5] - B[4] - 0.3))) + ' VON 10',
    facts: [{ at: 1.2, text: 'Die Menschen *vertrauen* sich wieder.' },
            { at: GIFT - B[4], text: 'Aber keiner sagt mehr: *„Schönes Geschenk!“*' }] },
];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, k) { return [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)]; }
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(31); const rr = (a, b) => lerp(a, b, R());
const fmt = n => n.toLocaleString('de-DE');
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

// ============================================================
//  FIGUREN
// ============================================================
// Brustbild: (x, y) = Unterkante Oberkörper. o: skin, hair, hairCol, shirt, tie, glasses, mood, talk, look, t
function person(x, y, s, o = {}) {
  const t = o.t || 0, skin = o.skin || '#f1c7a5', hc = o.hairCol || '#3b2416';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.hair === 'long') { ctx.fillStyle = hc; ctx.beginPath(); ctx.roundRect(-108, -470, 216, 250, 90); ctx.fill(); }
  if (o.hair === 'bun') circ(0, -478, 46, hc);
  if (o.robe) rrect(-140, -270, 280, 290, [100, 100, 10, 10], '#1c1c24');
  else rrect(-125, -265, 250, 285, [95, 95, 14, 14], o.shirt || '#3d7bd9');
  if (o.robe) { rrect(-40, -270, 80, 70, 10, '#f4f4f4'); }
  if (o.tie) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-45, -265); ctx.lineTo(0, -200); ctx.lineTo(45, -265); ctx.fill(); ctx.fillStyle = o.tie; ctx.beginPath(); ctx.moveTo(-14, -250); ctx.lineTo(14, -250); ctx.lineTo(22, -120); ctx.lineTo(0, -95); ctx.lineTo(-22, -120); ctx.fill(); }
  rect(-28, -300, 56, 50, skin);
  circ(0, -380, 100, skin);
  circ(-100, -375, 20, skin); circ(100, -375, 20, skin);
  ctx.fillStyle = hc;
  if (o.hair === 'bald') { ctx.beginPath(); ctx.arc(-80, -400, 34, 0, 7); ctx.arc(80, -400, 34, 0, 7); ctx.fill(); }
  else if (o.hair === 'bun' || o.hair === 'long' || !o.hair || o.hair === 'short') { ctx.beginPath(); ctx.arc(0, -392, 104, Math.PI * 1.03, Math.PI * 1.97); ctx.quadraticCurveTo(40, -420, -10, -440); ctx.quadraticCurveTo(-60, -410, -102, -405); ctx.fill(); }
  if (o.hair === 'white') { ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(0, -392, 104, Math.PI * 1.03, Math.PI * 1.97); ctx.fill(); for (const sx of [-1, 1]) circ(sx * 92, -380, 30, '#e8e8e8'); }
  const m = o.mood || 'neutral', lk = (o.look || 0) * 8;
  // Augen
  if (m === 'happy') { ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 9; ctx.lineCap = 'round'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 38, -385, 17, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); } }
  else { const er = m === 'shock' ? 25 : 19, pr = m === 'shock' ? 8 : 11; for (const sx of [-1, 1]) { circ(sx * 38, -388, er, '#fff'); circ(sx * 38 + lk, -386, pr, '#1d140f'); } }
  // Brauen
  ctx.strokeStyle = o.hair === 'white' ? '#cfcfcf' : '#2a1a12'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath();
  if (m === 'angry') { ctx.moveTo(-62, -432); ctx.lineTo(-18, -416); ctx.moveTo(62, -432); ctx.lineTo(18, -416); }
  else if (m === 'sad') { ctx.moveTo(-60, -414); ctx.lineTo(-20, -430); ctx.moveTo(60, -414); ctx.lineTo(20, -430); }
  else if (m === 'shock') { ctx.moveTo(-60, -440); ctx.lineTo(-18, -446); ctx.moveTo(60, -440); ctx.lineTo(18, -446); }
  else { ctx.moveTo(-58, -425); ctx.lineTo(-20, -425); ctx.moveTo(58, -425); ctx.lineTo(20, -425); }
  ctx.stroke();
  if (o.glasses) { ctx.strokeStyle = '#222'; ctx.lineWidth = 6; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 38, -388, 30, 0, 7); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(-8, -390); ctx.lineTo(8, -390); ctx.stroke(); }
  // Mund
  ctx.strokeStyle = '#5a2418'; ctx.lineWidth = 9; ctx.beginPath();
  if (o.talk) { const h = 10 + 14 * Math.abs(Math.sin(t * 17)); ctx.fillStyle = '#5a2418'; ctx.ellipse(0, -322, 26, h, 0, 0, 7); ctx.fill(); }
  else if (m === 'shock') { ctx.fillStyle = '#5a2418'; ctx.ellipse(0, -318, 22, 30, 0, 0, 7); ctx.fill(); }
  else if (m === 'happy') { ctx.arc(0, -345, 36, 0.25, Math.PI - 0.25); ctx.stroke(); }
  else if (m === 'sad') { ctx.arc(0, -295, 30, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); }
  else if (m === 'angry') { ctx.moveTo(-30, -318); ctx.lineTo(30, -326); ctx.stroke(); }
  else { ctx.moveTo(-24, -322); ctx.lineTo(24, -322); ctx.stroke(); }
  if (m === 'happy') { circ(-62, -345, 16, 'rgba(255,90,90,0.3)'); circ(62, -345, 16, 'rgba(255,90,90,0.3)'); }
  if (o.sweat) { ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.moveTo(95, -460); ctx.quadraticCurveTo(118, -425, 95, -420); ctx.quadraticCurveTo(72, -425, 95, -460); ctx.fill(); }
  if (o.tear) { const k = (t * 1.5) % 1; ctx.fillStyle = '#7fd0ff'; ctx.beginPath(); ctx.ellipse(-40, -360 + k * 60, 9, 14, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}
function bubble(x, y, text, k, o = {}) {
  if (k <= 0) return;
  const size = o.size || 54; ctx.save(); ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(text).width + 70, h = size + 52;
  ctx.translate(x, y); const s = backOut(clamp(k)); ctx.scale(s, s);
  ctx.fillStyle = o.bg || '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 7;
  const tx = o.tail === 'left' ? -w / 2 + 70 : o.tail === 'right' ? w / 2 - 70 : 0;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 36); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx - 22, h / 2 - 4); ctx.lineTo(tx + (o.tail === 'right' ? 30 : -30) * (o.tail ? 1 : 0), h / 2 + 46); ctx.lineTo(tx + 22, h / 2 - 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 22, h / 2); ctx.lineTo(tx + (o.tail === 'right' ? 30 : -30) * (o.tail ? 1 : 0), h / 2 + 46); ctx.lineTo(tx + 22, h / 2); ctx.stroke();
  ctx.fillStyle = o.col || '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 3);
  ctx.restore();
}
function stamp(txt, x, y, k, col = '#ff2d4a', rot = -0.12, size = 84) {
  if (k <= 0) return; const s = lerp(2.2, 1, easeOut(clamp(k))); ctx.save(); ctx.globalAlpha = clamp(k * 3); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(txt).width + 60; ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.beginPath(); ctx.roundRect(-w / 2, -size * 0.75, w, size * 1.5, 20); ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 4); ctx.restore();
}
function heart(x, y, s, col, split = 0) {
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(x + side * split * 60, y + split * 30); ctx.rotate(side * split * 0.35); ctx.scale(s, s);
    ctx.beginPath(); ctx.rect(side < 0 ? -200 : 0, -200, 200, 400); ctx.clip();
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 60); ctx.bezierCurveTo(-110, -10, -90, -110, -40, -110); ctx.bezierCurveTo(-10, -110, 0, -80, 0, -60); ctx.bezierCurveTo(0, -80, 10, -110, 40, -110); ctx.bezierCurveTo(90, -110, 110, -10, 0, 60); ctx.fill();
    if (split > 0) { ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-12, -30); ctx.lineTo(10, -5); ctx.lineTo(-8, 25); ctx.lineTo(0, 60); ctx.stroke(); }
    ctx.restore();
  }
}
function room(wall, floor, floorY = 1600) {
  const g = ctx.createLinearGradient(0, 0, 0, floorY); g.addColorStop(0, wall[0]); g.addColorStop(1, wall[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, floorY);
  rect(0, floorY, W, H - floorY, floor); rect(0, floorY, W, 10, 'rgba(0,0,0,0.25)');
}
function phone(x, y, w, h) {
  rrect(x - 16, y - 16, w + 32, h + 32, 60, '#111'); rrect(x, y, w, h, 46, '#f3f4f8'); rrect(x + w / 2 - 70, y + 6, 140, 30, 15, '#111');
}

// ============================================================
//  SHOTS
// ============================================================
// --- Hook: Lügendetektor ---
function hookShot(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1330'); g.addColorStop(1, '#1d0f2e'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const y0 = 1120, h = 460, calm = ease(inv(TRUTH, TRUTH + 0.5, t));
  rrect(40, y0, W - 80, h, 28, '#f6f1e2');
  ctx.strokeStyle = 'rgba(200,80,80,0.18)'; ctx.lineWidth = 2; const off = (t * 420) % 40;
  for (let x = 40 - off + 40; x < W - 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); ctx.stroke(); }
  for (let y = y0 + 20; y < y0 + h; y += 40) { ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 40, y); ctx.stroke(); }
  ctx.save(); ctx.beginPath(); ctx.rect(40, y0, W - 80, h); ctx.clip();
  ctx.lineWidth = 7; ctx.lineJoin = 'round';
  const pen = 820;
  ctx.beginPath();
  for (let x = 40; x <= pen; x += 6) {
    const tt = t - (pen - x) / 420;      // Wert zur damaligen Zeit
    const c = ease(inv(TRUTH, TRUTH + 0.5, tt));
    const wild = (Math.sin(tt * 37) * 0.6 + Math.sin(tt * 91) * 0.4) * 170 * (1 - c), soft = Math.sin(tt * 6) * 30 * c;
    const y = y0 + h / 2 + wild + soft; x === 40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = rgb(mix(hex('#e8232f'), hex('#19b35a'), calm)); ctx.stroke(); ctx.restore();
  rect(pen - 4, y0 - 20, 8, h + 40, '#333'); circ(pen, y0 + h / 2 + (Math.sin(t * 37) * 0.6 + Math.sin(t * 91) * 0.4) * 170 * (1 - calm) + Math.sin(t * 6) * 30 * calm, 14, '#333');
  const lbl = calm > 0.5 ? 'WAHRHEIT' : 'LÜGE', col = calm > 0.5 ? '#19b35a' : '#e8232f';
  rrect(W / 2 - 230, 1640, 460, 110, 55, col); ctx.fillStyle = '#fff'; ctx.font = `900 64px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(lbl, W / 2, 1697);
  if (calm < 0.5 && Math.sin(t * 20) > 0) circ(W / 2 - 180, 1695, 14, '#fff');
}
// --- Büro ---
function officeShot(t) {
  room(['#f4e6cc', '#e6cfa6'], '#8a6a4a', 1640);
  rrect(620, 260, 360, 420, 12, '#bfe3ff'); rect(795, 260, 10, 420, '#fff'); rect(620, 465, 360, 10, '#fff');
  rrect(80, 330, 230, 180, 8, '#fff'); for (let i = 0; i < 5; i++) rect(110 + i * 38, 470 - [60, 90, 70, 120, 140][i], 26, [60, 90, 70, 120, 140][i], '#4caf50');
  const shock = t > HATE + 0.5;
  person(300, 1560, 0.95, { shirt: '#3d7bd9', mood: t > HATE ? 'angry' : 'neutral', talk: t > HATE && t < HATE + 1.1, t, look: 1 });
  person(790, 1560, 1.0, { shirt: '#2f3542', tie: '#c0392b', hair: 'bald', glasses: true, mood: shock ? 'shock' : 'happy', talk: t > ASK && t < ASK + 0.65, t, look: -1, sweat: shock });
  rrect(0, 1500, W, 60, 8, '#6b4a2e'); rect(0, 1560, W, 80, '#4e3420');
  rrect(380, 1420, 260, 90, 8, '#222'); rect(395, 1430, 230, 70, '#5cc8ff');
  bubble(760, 1040, 'Wie geht’s?', t < HATE ? inv(ASK, ASK + 0.3, t) : 0, { tail: 'right' });
  bubble(400, 1060, 'Ich hasse diesen Job.', inv(HATE, HATE + 0.3, t), { tail: 'left', col: '#e8232f', size: 52 });
}
// --- Werbung ---
const walkers = Array.from({ length: 5 }, (_, i) => ({ x: rr(0, W), sp: rr(60, 140) * (i % 2 ? 1 : -1), c: ['#e67e22', '#9b59b6', '#16a085', '#e84393', '#2d3436'][i] }));
function burger(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#e9a43c'; ctx.beginPath(); ctx.ellipse(0, -60, 160, 90, 0, Math.PI, 0); ctx.fill();
  for (let i = 0; i < 8; i++) circ(-100 + i * 28, -100 - Math.sin(i * 2) * 20, 6, '#fff3c4');
  rrect(-175, -60, 350, 26, 13, '#5bbd3a'); rrect(-165, -36, 330, 40, 18, '#ffcd2e'); rrect(-160, -10, 320, 50, 22, '#6b3416'); rrect(-160, 40, 320, 50, [8, 8, 40, 40], '#e9a43c');
  ctx.restore();
}
function adShot(t) {
  const lt = t - AD;
  const g = ctx.createLinearGradient(0, 0, 0, 1700); g.addColorStop(0, '#7cc8ff'); g.addColorStop(1, '#d4efff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 1700);
  for (let i = 0; i < 6; i++) rect(i * 190 - 20, 1250 - (i % 3) * 120, 170, 500, ['#b0bec5', '#90a4ae', '#cfd8dc'][i % 3]);
  rect(0, 1700, W, H - 1700, '#555'); for (let x = -((t * 200) % 160); x < W; x += 160) rect(x, 1800, 80, 14, '#eee');
  rect(330, 1450, 30, 260, '#444'); rect(720, 1450, 30, 260, '#444');
  rrect(110, 920, 860, 560, 18, '#222'); rrect(130, 940, 820, 520, 10, '#ffd23f');
  ctx.fillStyle = '#e8232f'; ctx.font = `900 76px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const big = lerp(1.25, 0.55, ease(inv(0.6, 1.4, lt)));
  burger(540, 1260, big);
  ctx.fillText('MEGA XXL BURGER!', 540, 1010);
  if (lt > 0.45) { ctx.strokeStyle = '#111'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(190, 1010); ctx.lineTo(lerp(190, 890, ease(inv(0.45, 0.75, lt))), 1010); ctx.stroke(); }
  stamp('In echt: halb so groß', 540, 1410, inv(1.3, 1.6, lt), '#111', -0.06, 58);
  for (const w of walkers) { const x = ((w.x + w.sp * t) % (W + 200) + W + 200) % (W + 200) - 100; ctx.save(); ctx.translate(x, 1700); rrect(-26, -150, 52, 110, 22, w.c); circ(0, -175, 28, '#f1c7a5'); rect(-20, -45, 14, 45, '#333'); rect(6, -45, 14, 45, '#333'); ctx.restore(); }
}
// --- Chat: Beziehung ---
function chatShot(t) {
  const lt = t - B[2];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ff8fb1'); g.addColorStop(1, '#7a3cff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) { const y = (1900 - ((t * 80 + i * 230) % 2100)); heart(80 + (i * 137) % 920, y, 0.25, 'rgba(255,255,255,0.18)'); }
  const x = 290, y = 900, w = 500, h = 980; phone(x, y, w, h);
  rect(x, y + 50, w, 90, '#fff'); circ(x + 60, y + 95, 30, '#ffb3c7'); ctx.fillStyle = '#111'; ctx.font = `800 34px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Schatz ❤', x + 105, y + 95);
  const msg = (txt, mine, my, k, col) => { if (k <= 0) return; ctx.save(); ctx.globalAlpha = clamp(k * 2); ctx.font = `800 36px ${FONT}`; const mw = ctx.measureText(txt).width + 50; const mx = mine ? x + w - 24 - mw : x + 24; const s = backOut(clamp(k)); ctx.translate(mx + mw / 2, my); ctx.scale(s, s); rrect(-mw / 2, -40, mw, 80, 30, col || (mine ? '#34c759' : '#e5e5ea')); ctx.fillStyle = mine ? '#fff' : '#111'; ctx.textAlign = 'center'; ctx.fillText(txt, 0, 2); ctx.restore(); };
  msg('Liebst du mich noch?', true, y + 220, inv(0.3, 0.55, lt));
  if (lt > 0.8 && lt < 1.5) for (let i = 0; i < 3; i++) circ(x + 60 + i * 30, y + 330 + Math.sin(t * 12 + i) * 6, 10, '#999');
  msg('Ehrlich?', false, y + 330, inv(1.5, 1.7, lt)); msg('Nein.', false, y + 430, inv(1.85, 2.05, lt));
  const hk = inv(2.0, 2.3, lt); if (hk > 0) heart(x + w / 2, y + 700, 1.3 * backOut(hk), '#ff2d55', ease(inv(2.3, 2.7, lt)));
}
// --- TV: Politiker ---
function tvShot(t) {
  const lt = t - TV;
  room(['#2b2f45', '#1c1f30'], '#3a2c22', 1640);
  rrect(90, 930, 900, 600, 30, '#111'); rect(120, 960, 840, 540, '#1d4e9e');
  for (let i = 0; i < 5; i++) circ(220 + i * 160, 1050, 50, 'rgba(255,255,255,0.08)');
  const run = ease(inv(0.3, 1.2, lt));
  ctx.save(); ctx.beginPath(); ctx.rect(120, 960, 840, 540); ctx.clip();

    const k = (t - w) / 0.36 + 0.5; if (k < 0 || k > 1) continue;
    const x = lerp(-2300, 1500, k);
    const gr = ctx.createLinearGradient(x, 0, x + 2200, 0); gr.addColorStop(0, 'rgba(63,208,255,0)'); gr.addColorStop(0.15, 'rgba(63,208,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(0.85, 'rgba(63,208,255,1)'); gr.addColorStop(1, 'rgba(63,208,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x + 400, 0); ctx.lineTo(x + 2200, 0); ctx.lineTo(x + 1800, H); ctx.lineTo(x, H); ctx.fill();
  }
}

// ---------- main ----------
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const z = zoomAt(t), sh = shake(t) * 14;
  ctx.translate(W / 2 + Math.sin(t * 73) * sh, H * 0.62 + Math.cos(t * 61) * sh); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.62);
  drawShot(t);
  ctx.restore();
  const tg = ctx.createLinearGradient(0, 0, 0, 900); tg.addColorStop(0, 'rgba(0,0,0,0.55)'); tg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 900);
  const vg = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawHook(t); drawTimeline(t);
  for (const sc of SCENES) drawSceneText(t, sc);
  drawOutro(t);
  drawWipe(t);
  const fl = flash(t); if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.9})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
if (!location.hash.includes('render')) { const st = performance.now(); (function loop() { renderFrame(((performance.now() - st) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); }
document.fonts.load(`900 100px Inter`).then(() => { window.READY = true; });
</script>
